<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Orbital Kronnos — Estrategia</title>
<link rel="icon" href="../images/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F5EBD6;--cream2:#d8cdb3;--gold:#E2BF6E;--gold2:#C9A14A;--gold3:#B07D3B;
  --dark:#0a0807;--glow:rgba(226,191,110,0.22);
  --fd:"Orbitron","Cinzel",sans-serif;--fb:"Cormorant Garamond",Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{background:#111;color:var(--cream);font-family:var(--fb);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;}

.hdr{flex-shrink:0;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--glow);background:rgba(10,8,7,.92);backdrop-filter:blur(12px);z-index:30;position:relative;}
.hdr-logo{font-family:var(--fd);font-weight:900;font-size:14px;letter-spacing:4px;color:var(--gold);}
.hdr-logo em{font-style:normal;}
.hdr-title{font-family:var(--fd);font-size:10px;letter-spacing:4px;color:var(--cream2);text-transform:uppercase;}
.hdr-back{font-family:var(--fd);font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--cream2);border:1px solid var(--glow);padding:6px 14px;transition:all .25s;text-decoration:none;white-space:nowrap;}
.hdr-back:hover{color:var(--gold);border-color:var(--gold);}

.toolbar{flex-shrink:0;display:flex;align-items:center;gap:4px;padding:6px 10px;background:rgba(14,11,10,.97);border-bottom:1px solid var(--glow);flex-wrap:wrap;z-index:20;position:relative;}
.tg{display:flex;align-items:center;gap:3px;padding-right:8px;border-right:1px solid rgba(226,191,110,.15);}
.tg:last-child{border-right:none;margin-left:auto;}
.tb{background:rgba(255,255,255,.04);border:1px solid rgba(226,191,110,.15);color:var(--cream2);font-family:var(--fd);font-size:8px;letter-spacing:1.5px;padding:5px 8px;cursor:pointer;transition:all .18s;text-transform:uppercase;white-space:nowrap;line-height:1;}
.tb:hover{background:rgba(226,191,110,.1);border-color:var(--gold);color:var(--gold);}
.tb.act{background:rgba(226,191,110,.2);border-color:var(--gold);color:var(--gold);}
.swatch{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform .15s,border-color .15s;flex-shrink:0;}
.swatch:hover{transform:scale(1.2);}
.swatch.act{border-color:var(--gold);transform:scale(1.2);}
.szb{background:rgba(255,255,255,.04);border:1px solid rgba(226,191,110,.15);color:var(--cream2);width:26px;height:26px;cursor:pointer;transition:all .18s;display:flex;align-items:center;justify-content:center;}
.szb:hover,.szb.act{background:rgba(226,191,110,.15);border-color:var(--gold);color:var(--gold);}
.zoom-info{font-family:var(--fd);font-size:8px;letter-spacing:2px;color:var(--cream2);min-width:36px;text-align:center;}

.viewport{flex:1;position:relative;overflow:hidden;background:repeating-conic-gradient(#1a1a1a 0% 25%, #141414 0% 50%) 0 0 / 20px 20px;cursor:crosshair;}
.viewport.panning{cursor:grab;}
.viewport.panning-active{cursor:grabbing;}

#worldContainer{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform;}
#bgCanvas{position:absolute;top:0;left:0;display:block;}
#drawCanvas{position:absolute;top:0;left:0;display:block;}
#previewCanvas{position:absolute;top:0;left:0;display:block;pointer-events:none;}

.sticker-panel{position:absolute;bottom:12px;right:12px;background:rgba(12,10,9,.95);border:1px solid var(--glow);padding:10px;display:none;flex-direction:column;gap:6px;z-index:25;backdrop-filter:blur(10px);}
.sticker-panel.open{display:flex;}
.sticker-panel h4{font-family:var(--fd);font-size:8px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;}
.srow{display:flex;gap:5px;}
.sopt{width:44px;height:44px;border:1px solid rgba(226,191,110,.18);background:rgba(255,255,255,.02);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:24px;transition:all .18s;border-radius:3px;}
.sopt:hover{border-color:var(--gold);background:rgba(226,191,110,.12);}

.mob-hint{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);font-family:var(--fd);font-size:8px;letter-spacing:2px;color:rgba(226,191,110,.35);text-transform:uppercase;white-space:nowrap;pointer-events:none;transition:opacity .5s;}

@media(max-width:600px){
  .hdr-logo{font-size:12px;letter-spacing:2px;}
  .hdr-title{display:none;}
  .tg{gap:2px;padding-right:5px;}
  .tb{padding:5px 6px;font-size:7px;}
  .swatch{width:19px;height:19px;}
}
</style>
</head>
<body>

<header class="hdr">
  <span class="hdr-logo">ORBITAL <em>KRONNOS</em></span>
  <span class="hdr-title">🏆 Pizarrón de Estrategia</span>
  <a href="../menu/" class="hdr-back">← Menú</a>
</header>

<div class="toolbar" id="toolbar">
  <div class="tg">
    <button class="tb act" id="toolPen"    onclick="setTool('pen')">✏️ Lápiz</button>
    <button class="tb"     id="toolLine"   onclick="setTool('line')">📏 Línea</button>
    <button class="tb"     id="toolRect"   onclick="setTool('rect')">▭ Rect</button>
    <button class="tb"     id="toolCircle" onclick="setTool('circle')">○ Círculo</button>
    <button class="tb"     id="toolArrow"  onclick="setTool('arrow')">➤ Flecha</button>
    <button class="tb"     id="toolErase"  onclick="setTool('erase')">🧹 Borrar</button>
    <button class="tb"     id="toolPan"    onclick="setTool('pan')">✋ Mover</button>
  </div>

  <div class="tg">
    <div class="swatch act" style="background:#E2BF6E" onclick="setColor('#E2BF6E',this)"></div>
    <div class="swatch"     style="background:#ffffff" onclick="setColor('#ffffff',this)"></div>
    <div class="swatch"     style="background:#ef4444" onclick="setColor('#ef4444',this)"></div>
    <div class="swatch"     style="background:#22c55e" onclick="setColor('#22c55e',this)"></div>
    <div class="swatch"     style="background:#3b82f6" onclick="setColor('#3b82f6',this)"></div>
    <div class="swatch"     style="background:#f97316" onclick="setColor('#f97316',this)"></div>
    <div class="swatch"     style="background:#a855f7" onclick="setColor('#a855f7',this)"></div>
    <div class="swatch"     style="background:#06b6d4" onclick="setColor('#06b6d4',this)"></div>
    <div class="swatch"     style="background:#111111;border:1px solid #555" onclick="setColor('#111111',this)"></div>
    <input type="color" id="customColor" value="#E2BF6E"
      style="width:22px;height:22px;border-radius:50%;border:2px solid rgba(226,191,110,.3);cursor:pointer;padding:1px;background:none;"
      oninput="setColor(this.value,null)">
  </div>

  <div class="tg">
    <button class="szb act" id="s1" onclick="setSize(2,this)"><svg width="10" height="10"><circle cx="5" cy="5" r="1.5" fill="currentColor"/></svg></button>
    <button class="szb"     id="s2" onclick="setSize(5,this)"><svg width="10" height="10"><circle cx="5" cy="5" r="3"   fill="currentColor"/></svg></button>
    <button class="szb"     id="s3" onclick="setSize(10,this)"><svg width="10" height="10"><circle cx="5" cy="5" r="4.5" fill="currentColor"/></svg></button>
  </div>

  <div class="tg">
    <button class="tb" onclick="toggleStickerPanel()">🤖 Sticker</button>
  </div>

  <div class="tg">
    <button class="tb" onclick="zoomBy(1.25)">🔍+</button>
    <span class="zoom-info" id="zoomInfo">100%</span>
    <button class="tb" onclick="zoomBy(0.8)">🔍−</button>
    <button class="tb" onclick="resetView()">⊡ Reset</button>
  </div>

  <div class="tg">
    <button class="tb" onclick="undoLast()">↩ Deshacer</button>
    <button class="tb" onclick="clearAll()">🗑 Limpiar</button>
    <button class="tb" onclick="saveImage()">💾 Guardar</button>
  </div>
</div>

<div class="viewport" id="viewport">
  <div id="worldContainer">
    <canvas id="bgCanvas"></canvas>
    <canvas id="drawCanvas"></canvas>
    <canvas id="previewCanvas"></canvas>
  </div>

  <div class="sticker-panel" id="stickerPanel">
    <h4>Stickers</h4>
    <div class="srow">
      <div class="sopt" onclick="pickSticker('robot')">🤖</div>
      <div class="sopt" onclick="pickSticker('star')">⭐</div>
      <div class="sopt" onclick="pickSticker('target')">🎯</div>
      <div class="sopt" onclick="pickSticker('flag')">🚩</div>
    </div>
    <div class="srow">
      <div class="sopt" onclick="pickSticker('gear')">⚙️</div>
      <div class="sopt" onclick="pickSticker('lightning')">⚡</div>
      <div class="sopt" onclick="pickSticker('block')">🛑</div>
      <div class="sopt" onclick="pickSticker('ball')">🟣</div>
    </div>
  </div>

  <div class="mob-hint" id="mobHint">2 dedos = mover/zoom · 1 dedo = dibujar</div>
</div>

<script>
const SESSION_KEY='ok_session_v3',SESSION_TTL=7*24*60*60*1000,SIGN_KEY='OK::sign::v3::OK::2026::orbital-kronnos::v3::pepper',enc2=new TextEncoder();
async function hmacHex(m){const k=await crypto.subtle.importKey('raw',enc2.encode(SIGN_KEY),{name:'HMAC',hash:'SHA-256'},false,['sign']);const s=await crypto.subtle.sign('HMAC',k,enc2.encode(m));return Array.from(new Uint8Array(s)).map(b=>b.toString(16).padStart(2,'0')).join('');}
function constEq(a,b){if(typeof a!=='string'||typeof b!=='string'||a.length!==b.length)return false;let r=0;for(let i=0;i<a.length;i++)r|=a.charCodeAt(i)^b.charCodeAt(i);return r===0;}
async function validateSession(){const raw=sessionStorage.getItem(SESSION_KEY)||localStorage.getItem(SESSION_KEY);if(!raw)return null;try{const{p,s}=JSON.parse(raw);const ex=await hmacHex(p);if(!constEq(ex,s))return null;const d=JSON.parse(p);if(!d.u||Date.now()-d.ts>SESSION_TTL)return null;return d;}catch{return null;}}
window.addEventListener('load',async()=>{const s=await validateSession();if(!s){window.location.replace('../login/');return;}init();});

const vp   = document.getElementById('viewport');
const world= document.getElementById('worldContainer');
const bgC  = document.getElementById('bgCanvas');
const drC  = document.getElementById('drawCanvas');
const pvC  = document.getElementById('previewCanvas');
let bgX, drX, pvX;

let CW=1920, CH=1080;
let scale=1, panX=0, panY=0;
let tool='pen', color='#E2BF6E', size=2, stickerMode=null;
let drawing=false, startCX=0, startCY=0;
let history=[];
let bgImage=null;

let isPanning=false, panStartX=0, panStartY=0, panStartPanX=0, panStartPanY=0;
let spaceDown=false;

let pinching=false, pinchDist0=0, pinchScale0=1, pinchPanX0=0, pinchPanY0=0, pinchMidX=0, pinchMidY=0;

function init(){
  const img=new Image();
  img.onload=()=>{
    CW=img.naturalWidth; CH=img.naturalHeight;
    bgImage=img;
    setupCanvases();
    fitToView();
    renderBg();
    bindEvents();
    showMobHint();
  };
  img.onerror=()=>{
    CW=1920; CH=1080;
    setupCanvases();
    fitToView();
    renderBg();
    bindEvents();
    showMobHint();
  };
  img.src='../images/coso.png';
}

function setupCanvases(){
  [bgC,drC,pvC].forEach(c=>{c.width=CW;c.height=CH;});
  bgX=bgC.getContext('2d');
  drX=drC.getContext('2d');
  pvX=pvC.getContext('2d');
}

function renderBg(){
  bgX.clearRect(0,0,CW,CH);
  if(bgImage){bgX.drawImage(bgImage,0,0,CW,CH);}
  else{
    bgX.fillStyle='#0f0d0b';bgX.fillRect(0,0,CW,CH);
    bgX.strokeStyle='rgba(226,191,110,0.07)';bgX.lineWidth=1;
    for(let x=0;x<CW;x+=40){bgX.beginPath();bgX.moveTo(x,0);bgX.lineTo(x,CH);bgX.stroke();}
    for(let y=0;y<CH;y+=40){bgX.beginPath();bgX.moveTo(0,y);bgX.lineTo(CW,y);bgX.stroke();}
  }
}

function applyTransform(){
  world.style.transform=`translate(${panX}px,${panY}px) scale(${scale})`;
  document.getElementById('zoomInfo').textContent=Math.round(scale*100)+'%';
}

function fitToView(){
  const vw=vp.clientWidth, vh=vp.clientHeight;
  const s=Math.min(vw/CW, vh/CH)*0.92;
  scale=s;
  panX=(vw-CW*s)/2;
  panY=(vh-CH*s)/2;
  applyTransform();
}

function resetView(){fitToView();}

function zoomBy(factor, cx, cy){
  const vw=vp.clientWidth, vh=vp.clientHeight;
  if(cx===undefined) cx=vw/2;
  if(cy===undefined) cy=vh/2;
  const ns=Math.max(0.08, Math.min(8, scale*factor));
  const ratio=ns/scale;
  panX=cx-(cx-panX)*ratio;
  panY=cy-(cy-panY)*ratio;
  scale=ns;
  applyTransform();
}

function vpToCanvas(vx, vy){
  return {x:(vx-panX)/scale, y:(vy-panY)/scale};
}

function bindEvents(){
  vp.addEventListener('wheel', onWheel, {passive:false});
  vp.addEventListener('pointerdown', onPD);
  vp.addEventListener('pointermove', onPM);
  vp.addEventListener('pointerup',   onPU);
  vp.addEventListener('pointercancel', onPU);
  vp.addEventListener('contextmenu', e=>e.preventDefault());
  document.addEventListener('keydown', e=>{
    if(e.code==='Space'&&!e.target.matches('input,textarea')){e.preventDefault();spaceDown=true;vp.classList.add('panning');}
    if((e.ctrlKey||e.metaKey)&&e.code==='KeyZ'){e.preventDefault();undoLast();}
  });
  document.addEventListener('keyup', e=>{
    if(e.code==='Space'){spaceDown=false;if(!isPanning)vp.classList.remove('panning');}
  });
  window.addEventListener('resize', ()=>{if(!drawing)fitToView();});
}

function onWheel(e){
  e.preventDefault();
  const rect=vp.getBoundingClientRect();
  const cx=e.clientX-rect.left, cy=e.clientY-rect.top;
  const factor=e.deltaY<0?1.12:1/1.12;
  zoomBy(factor,cx,cy);
}

const activePointers={};
function onPD(e){
  e.preventDefault();
  activePointers[e.pointerId]=e;
  vp.setPointerCapture(e.pointerId);
  const pts=Object.values(activePointers);

  if(pts.length===2){
    drawing=false;
    pvX.clearRect(0,0,CW,CH);
    pinching=true;
    isPanning=false;
    const r=vp.getBoundingClientRect();
    const ax=(pts[0].clientX-r.left), ay=(pts[0].clientY-r.top);
    const bx=(pts[1].clientX-r.left), by=(pts[1].clientY-r.top);
    pinchDist0=Math.hypot(bx-ax,by-ay);
    pinchScale0=scale;
    pinchMidX=(ax+bx)/2; pinchMidY=(ay+by)/2;
    pinchPanX0=panX; pinchPanY0=panY;
    return;
  }

  if(e.button===1||(e.button===0&&spaceDown)||tool==='pan'){
    isPanning=true;
    vp.classList.add('panning-active');
    const r=vp.getBoundingClientRect();
    panStartX=e.clientX-r.left; panStartY=e.clientY-r.top;
    panStartPanX=panX; panStartPanY=panY;
    return;
  }

  if(e.button!==0) return;
  const r=vp.getBoundingClientRect();
  const vx=e.clientX-r.left, vy=e.clientY-r.top;
  const {x,y}=vpToCanvas(vx,vy);

  if(stickerMode){drawStickerAt(x,y);saveHistory();return;}

  drawing=true;
  startCX=x; startCY=y;
  if(tool==='pen'||tool==='erase'){drX.beginPath();drX.moveTo(x,y);}
}

function onPM(e){
  e.preventDefault();
  activePointers[e.pointerId]=e;
  const pts=Object.values(activePointers);

  if(pinching&&pts.length>=2){
    const r=vp.getBoundingClientRect();
    const ax=(pts[0].clientX-r.left), ay=(pts[0].clientY-r.top);
    const bx=(pts[1].clientX-r.left), by=(pts[1].clientY-r.top);
    const dist=Math.hypot(bx-ax,by-ay);
    const mid={x:(ax+bx)/2,y:(ay+by)/2};
    const sf=dist/pinchDist0;
    const ns=Math.max(0.08,Math.min(8,pinchScale0*sf));
    const ratio=ns/pinchScale0;
    panX=pinchMidX-(pinchMidX-pinchPanX0)*ratio+(mid.x-pinchMidX);
    panY=pinchMidY-(pinchMidY-pinchPanY0)*ratio+(mid.y-pinchMidY);
    scale=ns;
    applyTransform();
    return;
  }

  if(isPanning){
    const r=vp.getBoundingClientRect();
    const vx=e.clientX-r.left, vy=e.clientY-r.top;
    panX=panStartPanX+(vx-panStartX);
    panY=panStartPanY+(vy-panStartY);
    applyTransform();
    return;
  }

  if(!drawing) return;
  const r=vp.getBoundingClientRect();
  const vx=e.clientX-r.left, vy=e.clientY-r.top;
  const {x,y}=vpToCanvas(vx,vy);

  if(tool==='pen'||tool==='erase'){
    drX.lineWidth=tool==='erase'?size*6:size;
    drX.lineCap='round'; drX.lineJoin='round';
    drX.strokeStyle=tool==='erase'?'rgba(0,0,0,1)':color;
    drX.globalCompositeOperation=tool==='erase'?'destination-out':'source-over';
    drX.lineTo(x,y); drX.stroke();
  } else {
    pvX.clearRect(0,0,CW,CH);
    drawShape(pvX,tool,startCX,startCY,x,y,color,size);
  }
}

function onPU(e){
  e.preventDefault();
  delete activePointers[e.pointerId];
  const pts=Object.values(activePointers);

  if(pinching&&pts.length<2){pinching=false;}

  if(isPanning&&pts.length===0){
    isPanning=false;
    vp.classList.remove('panning-active');
    if(!spaceDown)vp.classList.remove('panning');
    return;
  }

  if(!drawing) return;
  drawing=false;
  const r=vp.getBoundingClientRect();
  const vx=e.clientX-r.left, vy=e.clientY-r.top;
  const {x,y}=vpToCanvas(vx,vy);

  if(tool!=='pen'&&tool!=='erase'){
    pvX.clearRect(0,0,CW,CH);
    drawShape(drX,tool,startCX,startCY,x,y,color,size);
  } else {
    drX.globalCompositeOperation='source-over';
  }
  saveHistory();
}

function drawShape(ctx,t,x1,y1,x2,y2,col,w){
  ctx.save();
  ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=w;
  ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.globalCompositeOperation='source-over';
  if(t==='line'){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
  else if(t==='rect'){ctx.beginPath();ctx.rect(x1,y1,x2-x1,y2-y1);ctx.stroke();}
  else if(t==='circle'){
    const rx=Math.abs(x2-x1)/2,ry=Math.abs(y2-y1)/2,cx=(x1+x2)/2,cy=(y1+y2)/2;
    ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);ctx.stroke();
  } else if(t==='arrow'){
    const dx=x2-x1,dy=y2-y1,angle=Math.atan2(dy,dx),hl=Math.max(14,w*5);
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x2,y2);
    ctx.lineTo(x2-hl*Math.cos(angle-Math.PI/7),y2-hl*Math.sin(angle-Math.PI/7));
    ctx.lineTo(x2-hl*Math.cos(angle+Math.PI/7),y2-hl*Math.sin(angle+Math.PI/7));
    ctx.closePath();ctx.fill();
  }
  ctx.restore();
}

function drawStickerAt(x,y){
  const map={robot:'🤖',star:'⭐',target:'🎯',flag:'🚩',gear:'⚙️',lightning:'⚡',block:'🛑',ball:'🟣'};
  const em=map[stickerMode]||'🤖';
  drX.save();
  drX.font='48px serif';
  drX.textAlign='center';drX.textBaseline='middle';
  drX.globalCompositeOperation='source-over';
  drX.fillText(em,x,y);
  drX.restore();
}

function saveHistory(){
  history.push(drX.getImageData(0,0,CW,CH));
  if(history.length>50)history.shift();
}

function undoLast(){
  if(!history.length)return;
  history.pop();
  drX.clearRect(0,0,CW,CH);
  if(history.length)drX.putImageData(history[history.length-1],0,0);
}

function clearAll(){
  if(!confirm('¿Limpiar todo el dibujo?'))return;
  history=[];
  drX.clearRect(0,0,CW,CH);
  pvX.clearRect(0,0,CW,CH);
}

function saveImage(){
  const out=document.createElement('canvas');
  out.width=CW;out.height=CH;
  const ctx=out.getContext('2d');
  ctx.drawImage(bgC,0,0);
  ctx.drawImage(drC,0,0);
  const a=document.createElement('a');
  a.download='estrategia-ok.png';
  a.href=out.toDataURL('image/png');
  a.click();
}

function setTool(t){
  tool=t; stickerMode=null;
  document.querySelectorAll('.tb[id^="tool"]').forEach(b=>b.classList.remove('act'));
  const el=document.getElementById('tool'+t.charAt(0).toUpperCase()+t.slice(1));
  if(el)el.classList.add('act');
  if(t==='pan'){vp.classList.add('panning');}
  else{vp.classList.remove('panning');}
  vp.style.cursor=t==='erase'?'cell':t==='pan'?'grab':'crosshair';
}

function setColor(c,el){
  color=c;
  document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('act'));
  if(el)el.classList.add('act');
}

function setSize(s,btn){
  size=s;
  document.querySelectorAll('.szb').forEach(b=>b.classList.remove('act'));
  btn.classList.add('act');
}

function toggleStickerPanel(){document.getElementById('stickerPanel').classList.toggle('open');}

function pickSticker(type){
  stickerMode=type;
  document.getElementById('stickerPanel').classList.remove('open');
  document.querySelectorAll('.tb[id^="tool"]').forEach(b=>b.classList.remove('act'));
  vp.style.cursor='copy';
}

function showMobHint(){
  const h=document.getElementById('mobHint');
  if(window.matchMedia('(pointer:coarse)').matches){
    setTimeout(()=>{h.style.opacity='0';},4000);
  } else {
    h.style.opacity='0';
  }
}
</script>
</body>
</html>
