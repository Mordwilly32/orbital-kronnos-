<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orbital Kronnos — Estrategia</title>
<link rel="icon" href="../images/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F5EBD6;--cream2:#d8cdb3;--gold:#E2BF6E;--gold2:#C9A14A;--gold3:#B07D3B;
  --dark:#0a0807;--glow:rgba(226,191,110,0.22);
  --fd:"Orbitron","Cinzel",sans-serif;--fb:"Cormorant Garamond",Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--dark);color:var(--cream);font-family:var(--fb);min-height:100vh;display:flex;flex-direction:column;overflow:hidden;}

.hdr{flex-shrink:0;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--glow);background:rgba(10,8,7,.85);backdrop-filter:blur(12px);z-index:20;position:relative;}
.hdr-logo{font-family:var(--fd);font-weight:900;font-size:15px;letter-spacing:4px;color:var(--gold);}
.hdr-logo em{font-style:normal;}
.hdr-title{font-family:var(--fd);font-size:11px;letter-spacing:5px;color:var(--cream2);text-transform:uppercase;}
.hdr-back{font-family:var(--fd);font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--cream2);border:1px solid var(--glow);padding:7px 16px;transition:all .25s;text-decoration:none;}
.hdr-back:hover{color:var(--gold);border-color:var(--gold);}

.workspace{flex:1;display:flex;flex-direction:column;overflow:hidden;}

.toolbar{flex-shrink:0;display:flex;align-items:center;gap:6px;padding:8px 14px;background:rgba(14,11,10,.95);border-bottom:1px solid var(--glow);flex-wrap:wrap;z-index:10;}

.tool-group{display:flex;align-items:center;gap:4px;padding:0 8px;border-right:1px solid var(--glow);}
.tool-group:last-child{border-right:none;}

.tool-btn{background:rgba(255,255,255,.04);border:1px solid rgba(226,191,110,.15);color:var(--cream2);font-family:var(--fd);font-size:9px;letter-spacing:2px;padding:6px 10px;cursor:pointer;transition:all .2s;text-transform:uppercase;white-space:nowrap;}
.tool-btn:hover{background:rgba(226,191,110,.1);border-color:var(--gold);color:var(--gold);}
.tool-btn.active{background:rgba(226,191,110,.18);border-color:var(--gold);color:var(--gold);}
.tool-btn.icon-btn{font-size:16px;padding:5px 8px;letter-spacing:0;}

.color-swatch{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform .15s,border-color .15s;flex-shrink:0;}
.color-swatch:hover{transform:scale(1.15);}
.color-swatch.active{border-color:var(--gold);transform:scale(1.15);}

.size-btn{background:rgba(255,255,255,.04);border:1px solid rgba(226,191,110,.15);color:var(--cream2);font-family:var(--fd);font-size:9px;padding:5px 8px;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;}
.size-btn:hover,.size-btn.active{background:rgba(226,191,110,.15);border-color:var(--gold);color:var(--gold);}

.canvas-wrap{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#111;}
#bgLayer{position:absolute;top:0;left:0;pointer-events:none;}
#drawCanvas{position:absolute;top:0;left:0;cursor:crosshair;touch-action:none;}
#previewCanvas{position:absolute;top:0;left:0;pointer-events:none;}

.sticker-panel{position:absolute;bottom:16px;right:16px;background:rgba(14,11,10,.92);border:1px solid var(--glow);padding:10px;display:none;flex-direction:column;gap:6px;z-index:15;backdrop-filter:blur(8px);}
.sticker-panel.open{display:flex;}
.sticker-panel h4{font-family:var(--fd);font-size:9px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;margin-bottom:4px;}
.sticker-row{display:flex;gap:6px;}
.sticker-opt{width:52px;height:52px;border:1px solid rgba(226,191,110,.2);background:rgba(255,255,255,.03);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:28px;transition:all .2s;border-radius:2px;}
.sticker-opt:hover{border-color:var(--gold);background:rgba(226,191,110,.12);}

@media(max-width:640px){
  .tool-group{gap:3px;padding:0 5px;}
  .tool-btn{padding:5px 7px;font-size:8px;}
  .color-swatch{width:22px;height:22px;}
}
</style>
</head>
<body>

<header class="hdr">
  <span class="hdr-logo">ORBITAL <em>KRONNOS</em></span>
  <span class="hdr-title">🏆 Pizarrón de Estrategia</span>
  <a href="../menu/" class="hdr-back">← Menú</a>
</header>

<div class="workspace">
  <div class="toolbar">
    <div class="tool-group">
      <button class="tool-btn active" id="toolPen"    onclick="setTool('pen')">✏️ Lápiz</button>
      <button class="tool-btn"        id="toolLine"   onclick="setTool('line')">📏 Línea</button>
      <button class="tool-btn"        id="toolRect"   onclick="setTool('rect')">▭ Rect</button>
      <button class="tool-btn"        id="toolCircle" onclick="setTool('circle')">○ Círculo</button>
      <button class="tool-btn"        id="toolArrow"  onclick="setTool('arrow')">➤ Flecha</button>
      <button class="tool-btn"        id="toolErase"  onclick="setTool('erase')">🧹 Borrar</button>
    </div>

    <div class="tool-group">
      <div class="color-swatch active" style="background:#E2BF6E" title="Dorado"  onclick="setColor('#E2BF6E',this)"></div>
      <div class="color-swatch"        style="background:#ffffff" title="Blanco"  onclick="setColor('#ffffff',this)"></div>
      <div class="color-swatch"        style="background:#ef4444" title="Rojo"    onclick="setColor('#ef4444',this)"></div>
      <div class="color-swatch"        style="background:#22c55e" title="Verde"   onclick="setColor('#22c55e',this)"></div>
      <div class="color-swatch"        style="background:#3b82f6" title="Azul"    onclick="setColor('#3b82f6',this)"></div>
      <div class="color-swatch"        style="background:#f97316" title="Naranja" onclick="setColor('#f97316',this)"></div>
      <div class="color-swatch"        style="background:#a855f7" title="Morado"  onclick="setColor('#a855f7',this)"></div>
      <div class="color-swatch"        style="background:#06b6d4" title="Cyan"    onclick="setColor('#06b6d4',this)"></div>
      <div class="color-swatch"        style="background:#000000" style2="border:1px solid #555" title="Negro"  onclick="setColor('#000000',this)"></div>
      <input type="color" id="customColor" value="#E2BF6E" title="Color personalizado"
        style="width:26px;height:26px;border-radius:50%;border:2px solid rgba(226,191,110,.3);cursor:pointer;padding:1px;background:none;"
        onchange="setColor(this.value,null)">
    </div>

    <div class="tool-group">
      <button class="size-btn active" id="s1" onclick="setSize(2,this)"  title="Fino">  <svg width="12" height="12"><circle cx="6" cy="6" r="1.5" fill="currentColor"/></svg></button>
      <button class="size-btn"        id="s2" onclick="setSize(5,this)"  title="Normal"><svg width="12" height="12"><circle cx="6" cy="6" r="3"   fill="currentColor"/></svg></button>
      <button class="size-btn"        id="s3" onclick="setSize(10,this)" title="Grueso"><svg width="12" height="12"><circle cx="6" cy="6" r="5"   fill="currentColor"/></svg></button>
    </div>

    <div class="tool-group">
      <button class="tool-btn" onclick="toggleStickerPanel()">🤖 Sticker</button>
    </div>

    <div class="tool-group">
      <button class="tool-btn" onclick="undoLast()">↩ Deshacer</button>
      <button class="tool-btn" onclick="clearCanvas()">🗑 Limpiar</button>
      <button class="tool-btn" onclick="saveImage()">💾 Guardar</button>
    </div>
  </div>

  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="bgLayer"></canvas>
    <canvas id="drawCanvas"></canvas>
    <canvas id="previewCanvas"></canvas>

    <div class="sticker-panel" id="stickerPanel">
      <h4>Stickers</h4>
      <div class="sticker-row">
        <div class="sticker-opt" onclick="placeSticker('robot')"    title="Robot">🤖</div>
        <div class="sticker-opt" onclick="placeSticker('star')"     title="Estrella">⭐</div>
        <div class="sticker-opt" onclick="placeSticker('target')"   title="Objetivo">🎯</div>
        <div class="sticker-opt" onclick="placeSticker('flag')"     title="Bandera">🚩</div>
      </div>
      <div class="sticker-row">
        <div class="sticker-opt" onclick="placeSticker('gear')"     title="Engranaje">⚙️</div>
        <div class="sticker-opt" onclick="placeSticker('lightning')" title="Rápido">⚡</div>
        <div class="sticker-opt" onclick="placeSticker('block')"    title="Bloqueo">🛑</div>
        <div class="sticker-opt" onclick="placeSticker('ball')"     title="Bola">🟣</div>
      </div>
    </div>
  </div>
</div>

<script>
const SESSION_KEY = 'ok_session_v3';
const SESSION_TTL = 7 * 24 * 60 * 60 * 1000;
const SIGN_KEY    = 'OK::sign::v3::OK::2026::orbital-kronnos::v3::pepper';
const enc2        = new TextEncoder();

async function hmacHex(msg) {
  const key = await crypto.subtle.importKey('raw', enc2.encode(SIGN_KEY), {name:'HMAC',hash:'SHA-256'}, false, ['sign']);
  const sig  = await crypto.subtle.sign('HMAC', key, enc2.encode(msg));
  return Array.from(new Uint8Array(sig)).map(b => b.toString(16).padStart(2,'0')).join('');
}
function constEq(a,b){if(typeof a!=='string'||typeof b!=='string'||a.length!==b.length)return false;let r=0;for(let i=0;i<a.length;i++)r|=a.charCodeAt(i)^b.charCodeAt(i);return r===0;}
async function validateSession(){
  const raw=sessionStorage.getItem(SESSION_KEY)||localStorage.getItem(SESSION_KEY);
  if(!raw)return null;
  try{const{p,s}=JSON.parse(raw);const expect=await hmacHex(p);if(!constEq(expect,s)){return null;}const data=JSON.parse(p);if(!data.u||Date.now()-data.ts>SESSION_TTL)return null;return data;}catch{return null;}
}
window.addEventListener('load', async()=>{
  const sess=await validateSession();
  if(!sess){window.location.replace('../login/');return;}
  initCanvas();
});

const bgCanvas   = document.getElementById('bgLayer');
const drawCanvas = document.getElementById('drawCanvas');
const prevCanvas = document.getElementById('previewCanvas');
const wrap       = document.getElementById('canvasWrap');
let bgCtx, drawCtx, prevCtx;

let tool  = 'pen';
let color = '#E2BF6E';
let size  = 2;
let drawing = false;
let startX = 0, startY = 0;
let lastX = 0, lastY = 0;
let history = [];
let stickerMode = null;

function initCanvas() {
  resizeCanvases();
  window.addEventListener('resize', resizeCanvases);
  drawCanvas.addEventListener('pointerdown', onDown);
  drawCanvas.addEventListener('pointermove', onMove);
  drawCanvas.addEventListener('pointerup',   onUp);
  drawCanvas.addEventListener('pointerleave', onUp);
}

function resizeCanvases() {
  const W = wrap.clientWidth, H = wrap.clientHeight;
  [bgCanvas, drawCanvas, prevCanvas].forEach(c => {
    c.width = W; c.height = H;
    c.style.width  = W + 'px';
    c.style.height = H + 'px';
  });
  bgCtx   = bgCanvas.getContext('2d');
  drawCtx = drawCanvas.getContext('2d');
  prevCtx = prevCanvas.getContext('2d');
  drawBackground();
  redrawHistory();
}

function drawBackground() {
  const W = bgCanvas.width, H = bgCanvas.height;
  bgCtx.clearRect(0,0,W,H);
  const img = new Image();
  img.onload = () => {
    bgCtx.drawImage(img, 0, 0, W, H);
    bgCtx.fillStyle = 'rgba(0,0,0,0.35)';
    bgCtx.fillRect(0,0,W,H);
  };
  img.onerror = () => {
    bgCtx.fillStyle = '#0f0d0b';
    bgCtx.fillRect(0,0,W,H);
    bgCtx.strokeStyle = 'rgba(226,191,110,0.08)';
    bgCtx.lineWidth = 1;
    for(let x=0;x<W;x+=40){bgCtx.beginPath();bgCtx.moveTo(x,0);bgCtx.lineTo(x,H);bgCtx.stroke();}
    for(let y=0;y<H;y+=40){bgCtx.beginPath();bgCtx.moveTo(0,y);bgCtx.lineTo(W,y);bgCtx.stroke();}
  };
  img.src = '../images/coso.png';
}

function getPos(e) {
  const r = drawCanvas.getBoundingClientRect();
  if (e.touches) {
    return { x: e.touches[0].clientX - r.left, y: e.touches[0].clientY - r.top };
  }
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

function onDown(e) {
  e.preventDefault();
  const { x, y } = getPos(e);

  if (stickerMode) {
    drawStickerAt(stickerMode, x, y);
    saveToHistory();
    return;
  }

  drawing = true;
  startX = lastX = x;
  startY = lastY = y;

  if (tool === 'pen' || tool === 'erase') {
    drawCtx.beginPath();
    drawCtx.moveTo(x, y);
  }
}

function onMove(e) {
  if (!drawing) return;
  e.preventDefault();
  const { x, y } = getPos(e);

  if (tool === 'pen' || tool === 'erase') {
    drawCtx.lineWidth   = tool === 'erase' ? size * 6 : size;
    drawCtx.lineCap     = 'round';
    drawCtx.lineJoin    = 'round';
    drawCtx.strokeStyle = tool === 'erase' ? 'rgba(0,0,0,1)' : color;
    if (tool === 'erase') drawCtx.globalCompositeOperation = 'destination-out';
    else drawCtx.globalCompositeOperation = 'source-over';
    drawCtx.lineTo(x, y);
    drawCtx.stroke();
    lastX = x; lastY = y;
  } else {
    prevCtx.clearRect(0,0,prevCanvas.width,prevCanvas.height);
    drawShape(prevCtx, tool, startX, startY, x, y, color, size);
  }
}

function onUp(e) {
  if (!drawing) return;
  drawing = false;
  const { x, y } = getPos(e);

  if (tool !== 'pen' && tool !== 'erase') {
    prevCtx.clearRect(0,0,prevCanvas.width,prevCanvas.height);
    drawShape(drawCtx, tool, startX, startY, x, y, color, size);
  } else {
    drawCtx.globalCompositeOperation = 'source-over';
  }
  saveToHistory();
}

function drawShape(ctx, t, x1, y1, x2, y2, col, w) {
  ctx.save();
  ctx.strokeStyle = col;
  ctx.fillStyle   = col;
  ctx.lineWidth   = w;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  ctx.globalCompositeOperation = 'source-over';

  if (t === 'line') {
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  } else if (t === 'rect') {
    ctx.beginPath(); ctx.rect(x1,y1,x2-x1,y2-y1); ctx.stroke();
  } else if (t === 'circle') {
    const rx = Math.abs(x2-x1)/2, ry = Math.abs(y2-y1)/2;
    const cx = (x1+x2)/2,        cy = (y1+y2)/2;
    ctx.beginPath(); ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2); ctx.stroke();
  } else if (t === 'arrow') {
    const dx = x2-x1, dy = y2-y1;
    const angle = Math.atan2(dy, dx);
    const len   = Math.sqrt(dx*dx+dy*dy);
    const headLen = Math.max(12, w*4);
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - headLen*Math.cos(angle-Math.PI/7), y2 - headLen*Math.sin(angle-Math.PI/7));
    ctx.lineTo(x2 - headLen*Math.cos(angle+Math.PI/7), y2 - headLen*Math.sin(angle+Math.PI/7));
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function drawStickerAt(type, x, y) {
  const map = {robot:'🤖',star:'⭐',target:'🎯',flag:'🚩',gear:'⚙️',lightning:'⚡',block:'🛑',ball:'🟣'};
  const emoji = map[type] || '🤖';
  drawCtx.font = '40px serif';
  drawCtx.textAlign = 'center';
  drawCtx.textBaseline = 'middle';
  drawCtx.globalCompositeOperation = 'source-over';
  drawCtx.fillText(emoji, x, y);
}

function saveToHistory() {
  history.push(drawCtx.getImageData(0,0,drawCanvas.width,drawCanvas.height));
  if (history.length > 40) history.shift();
}

function redrawHistory() {
  drawCtx.clearRect(0,0,drawCanvas.width,drawCanvas.height);
  if (history.length > 0) {
    drawCtx.putImageData(history[history.length-1], 0, 0);
  }
}

function undoLast() {
  if (history.length === 0) return;
  history.pop();
  drawCtx.clearRect(0,0,drawCanvas.width,drawCanvas.height);
  if (history.length > 0) {
    drawCtx.putImageData(history[history.length-1], 0, 0);
  }
}

function clearCanvas() {
  if (!confirm('¿Limpiar todo el dibujo?')) return;
  history = [];
  drawCtx.clearRect(0,0,drawCanvas.width,drawCanvas.height);
  prevCtx.clearRect(0,0,prevCanvas.width,prevCanvas.height);
}

function saveImage() {
  const out = document.createElement('canvas');
  out.width = bgCanvas.width; out.height = bgCanvas.height;
  const ctx = out.getContext('2d');
  ctx.drawImage(bgCanvas, 0, 0);
  ctx.drawImage(drawCanvas, 0, 0);
  const a = document.createElement('a');
  a.download = 'estrategia-ok.png';
  a.href = out.toDataURL('image/png');
  a.click();
}

function setTool(t) {
  tool = t;
  stickerMode = null;
  document.querySelectorAll('.tool-btn[id^="tool"]').forEach(b => b.classList.remove('active'));
  const el = document.getElementById('tool' + t.charAt(0).toUpperCase() + t.slice(1));
  if (el) el.classList.add('active');
  drawCanvas.style.cursor = t === 'erase' ? 'cell' : 'crosshair';
}

function setColor(c, el) {
  color = c;
  document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
  if (el) el.classList.add('active');
}

function setSize(s, btn) {
  size = s;
  document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function toggleStickerPanel() {
  const p = document.getElementById('stickerPanel');
  p.classList.toggle('open');
}

function placeSticker(type) {
  stickerMode = type;
  document.getElementById('stickerPanel').classList.remove('open');
  setTool('pen');
  stickerMode = type;
  drawCanvas.style.cursor = 'copy';
  document.querySelectorAll('.tool-btn[id^="tool"]').forEach(b => b.classList.remove('active'));
}
</script>
</body>
</html>
