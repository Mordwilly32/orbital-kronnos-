<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoboCoach — Orbital Kronnos</title>
<link rel="icon" href="images/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --navy:#0B1F3A; --gold:#E2BF6E; --gold2:#C9A14A; --gold3:#B07D3B;
  --dark:#0a0807; --dark2:#161210;
  --blue:#1D4F8A; --blue-lt:#E6F1FB;
  --text:#1a1a2e; --muted:#5a6a7e;
  --surf:#f4f6f9; --bord:rgba(0,0,0,0.1); --white:#fff;
  --green:#1D9E75; --red:#D85A30;
  --r:12px; --rsm:8px; --sh:0 2px 12px rgba(11,31,58,.12);
  --fd:"Orbitron","Cinzel",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--surf);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;}

/* HEADER */
.app-header{width:100%;background:var(--dark);padding:14px 20px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 8px rgba(0,0,0,.3);position:sticky;top:0;z-index:100;}
.logo-circle{width:42px;height:42px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px;}
.header-text h1{color:#fff;font-size:17px;font-weight:600;line-height:1.2;}
.header-text p{color:#8aa8cc;font-size:12px;margin-top:1px;}
.badges{margin-left:auto;display:flex;gap:6px;align-items:center;}
.badge{font-size:10px;font-weight:600;padding:4px 9px;border-radius:20px;letter-spacing:.4px;}
.badge-ftc{background:#1D4F8A;color:#7fb3f5;}
.badge-fgc{background:#3A1D00;color:var(--gold);}
.btn-back-hdr{font-family:var(--fd);font-size:9px;letter-spacing:3px;text-transform:uppercase;padding:7px 14px;border:1px solid rgba(226,191,110,.3);background:transparent;color:var(--gold);cursor:pointer;transition:all .2s;text-decoration:none;white-space:nowrap;}
.btn-back-hdr:hover{border-color:var(--gold);background:rgba(226,191,110,.08);}

/* LAYOUT */
.app-body{width:100%;max-width:800px;display:flex;flex-direction:column;height:calc(100vh - 72px);}

/* TABS */
.mode-tabs{display:flex;background:var(--white);border-bottom:1px solid var(--bord);overflow-x:auto;}
.tab{flex:1;min-width:100px;padding:11px 6px;font-size:12px;font-weight:500;border:none;background:transparent;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;transition:all .15s;white-space:nowrap;}
.tab.active{color:var(--gold2);border-bottom-color:var(--gold2);background:#fffbf0;}
.tab:hover:not(.active){background:var(--surf);color:var(--text);}

/* CHAT */
.chat-area{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;background:var(--surf);}
.msg{display:flex;gap:10px;align-items:flex-start;animation:fadeIn .25s ease;}
.msg-bot{flex-direction:row;}.msg-user{flex-direction:row-reverse;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;}
.avatar-bot{background:var(--gold);color:var(--navy);}
.avatar-user{background:var(--blue);color:white;}
.bubble{max-width:80%;padding:11px 14px;border-radius:var(--r);font-size:14px;line-height:1.65;box-shadow:var(--sh);}
.bubble-bot{background:var(--white);border-top-left-radius:4px;}
.bubble-user{background:var(--navy);color:#dce8f5;border-top-right-radius:4px;}
.bubble pre{background:#0d1117;color:#c9d1d9;font-family:'Courier New',monospace;font-size:12.5px;padding:12px 14px;border-radius:8px;margin:10px 0;overflow-x:auto;white-space:pre;line-height:1.5;border:1px solid #30363d;}
.bubble code{font-family:'Courier New',monospace;font-size:12.5px;background:rgba(0,0,0,.07);padding:1px 5px;border-radius:4px;}
.bubble-user code{background:rgba(255,255,255,.12);}
.bubble strong{font-weight:600;}
.bubble ul{padding-left:18px;margin:6px 0;}
.bubble li{margin-bottom:4px;}
.typing-dots{display:flex;gap:5px;align-items:center;padding:4px 0;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);animation:bounce 1.2s infinite ease-in-out;}
.dot:nth-child(2){animation-delay:.2s;}.dot:nth-child(3){animation-delay:.4s;}
@keyframes bounce{0%,80%,100%{transform:scale(.55);opacity:.4;}40%{transform:scale(1);opacity:1;}}

/* QUICK BUTTONS */
.quick-section{background:var(--white);border-top:1px solid var(--bord);padding:8px 14px;display:flex;gap:6px;flex-wrap:wrap;}
.qbtn{font-size:11.5px;padding:5px 11px;border-radius:20px;border:1px solid var(--bord);background:var(--surf);color:var(--muted);cursor:pointer;transition:all .15s;}
.qbtn:hover{background:var(--blue-lt);color:var(--navy);border-color:var(--blue);}

/* INPUT */
.input-row{display:flex;gap:8px;padding:12px 14px;background:var(--white);border-top:1px solid var(--bord);}
.input-row input{flex:1;font-size:14px;padding:9px 13px;border-radius:var(--rsm);border:1.5px solid var(--bord);background:var(--surf);color:var(--text);outline:none;transition:border-color .15s;}
.input-row input:focus{border-color:var(--gold);background:var(--white);}
.send-btn{width:40px;height:40px;border-radius:var(--rsm);background:var(--navy);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0;}
.send-btn:hover{background:var(--blue);}
.send-btn:disabled{opacity:.4;cursor:not-allowed;}
.send-btn svg{width:17px;height:17px;stroke:white;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

/* API KEY MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(11,31,58,.7);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;}
.modal-box{background:var(--white);border-radius:var(--r);padding:28px;max-width:440px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,.3);}
.modal-box h2{color:var(--navy);font-size:18px;margin-bottom:8px;}
.modal-box p{color:var(--muted);font-size:13px;line-height:1.6;margin-bottom:14px;}
.modal-input{width:100%;padding:10px 13px;font-size:14px;border:1.5px solid var(--bord);border-radius:var(--rsm);background:var(--surf);color:var(--text);margin-bottom:12px;outline:none;}
.modal-input:focus{border-color:var(--gold);}
.modal-btn{width:100%;padding:11px;border-radius:var(--rsm);background:var(--navy);color:white;border:none;font-size:15px;font-weight:600;cursor:pointer;transition:background .15s;}
.modal-btn:hover{background:var(--blue);}
.modal-link{display:block;text-align:center;margin-top:10px;font-size:12px;color:var(--blue);}
.modal-logo{font-size:32px;margin-bottom:12px;display:block;}

/* FOOTER */
.calc-section{background:var(--white);border-top:1px solid var(--bord);padding:10px 14px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.calc-btn{padding:5px 12px;border-radius:20px;border:1px solid var(--bord);background:var(--surf);color:var(--muted);font-size:11px;cursor:pointer;transition:all .15s;}
.calc-btn:hover{background:var(--navy);color:white;}

@media(max-width:600px){.header-text p{display:none;}.badge{font-size:9px;padding:3px 7px;}.bubble{max-width:90%;font-size:13px;}}
</style>
</head>
<body>

<!-- API KEY MODAL -->
<div class="modal-overlay" id="apiModal">
  <div class="modal-box">
    <span class="modal-logo">🤖</span>
    <h2>Activar RoboCoach</h2>
    <p>Ingresa tu API Key de Anthropic para activar el asistente. Se guarda solo en este dispositivo.</p>
    <input type="password" class="modal-input" id="apiKeyInput" placeholder="sk-ant-api03-..." />
    <button class="modal-btn" onclick="saveApiKey()">Activar RoboCoach</button>
    <a class="modal-link" href="https://console.anthropic.com" target="_blank">→ Obtener API Key</a>
  </div>
</div>

<!-- HEADER -->
<header class="app-header">
  <div class="logo-circle">🤖</div>
  <div class="header-text">
    <h1>RoboCoach — Orbital Kronnos</h1>
    <p>Asistente de programación · STEAM Maker FUSALMO 2026</p>
  </div>
  <div class="badges">
    <span class="badge badge-ftc">FTC</span>
    <span class="badge badge-fgc">FGC</span>
    <a href="index.html" class="btn-back-hdr">← Inicio</a>
  </div>
</header>

<!-- APP BODY -->
<div class="app-body">
  <div class="mode-tabs">
    <button class="tab active" onclick="setMode('ftc')">🤖 FTC · DECODE</button>
    <button class="tab" onclick="setMode('fgc')">🌍 FGC · Igniting Innovation</button>
    <button class="tab" onclick="setMode('debug')">🔧 Debug & Errores</button>
    <button class="tab" onclick="setMode('strategy')">🏆 Estrategia</button>
  </div>

  <div class="chat-area" id="chatArea"></div>

  <div class="quick-section" id="quickBtns"></div>

  <div class="input-row">
    <input type="text" id="userInput" placeholder="Escribe tu pregunta sobre el robot..." autocomplete="off" />
    <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="Enviar">
      <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>

  <div class="calc-section">
    <span>💡 Powered by Claude (Anthropic)</span>
    <button class="calc-btn" onclick="clearChat()">Nueva conversación</button>
    <button class="calc-btn" onclick="changeKey()">Cambiar API Key</button>
  </div>
</div>

<script>
const SYSTEMS={
  ftc:`Eres RoboCoach, experto en programación de robots FTC para estudiantes del programa STEAM Maker de FUSALMO (Fundación Salvador del Mundo) en El Salvador. Tu misión es ayudar a los jóvenes a programar su robot para el FTC 2025-2026 DECODE™ Presented by RTX.

CONOCIMIENTO DEL JUEGO FTC DECODE 2025-2026:
- El juego usa ARTIFACTs: bolas de polipropileno (24 purple, 12 green) de 5 pulgadas aprox.
- El campo tiene: GOAL (con SQUARE diverter y RAMP de 9 posiciones), BASE ZONE, LAUNCH ZONE, LOADING ZONE, SPIKE MARKS, DEPOT, OBELISK
- MOTIFS: 3 patrones (GPP, PGP, PPG) definidos por el OBELISK al inicio del MATCH
- RAMP tiene 9 índices; un ARTIFACT es CLASSIFIED si cae directamente al RAMP; OVERFLOW si pasa el SQUARE pero rebota sobre otros
- Los ARTIFACTs preloaded: hasta 3 por robot desde su ALLIANCE AREA

PUNTUACIÓN FTC DECODE:
- AUTO (30 segundos): LEAVE=3pts, CLASSIFIED ARTIFACT=3pts, OVERFLOW ARTIFACT=1pt
- TELEOP (2 minutos): CLASSIFIED=3pts, OVERFLOW=1pt, DEPOT=1pt
- PATTERN: 2pts por ARTIFACT que coincide con el MOTIF en su índice del RAMP
- BASE: Parcialmente retornado=5pts, Totalmente retornado=10pts, BONO 2 robots totalmente retornados=+10pts

PROGRAMACIÓN FTC:
- Lenguaje recomendado: Blocks o OnBot Java
- Clases principales: LinearOpMode, DcMotor, Servo, HardwareMap, Gamepad1/2
- IMU integrado en Control Hub para orientación

ESTRUCTURA BÁSICA JAVA FTC:
\`\`\`java
@TeleOp(name="MiRobot TeleOp")
public class MiRobotTeleOp extends LinearOpMode {
  DcMotor motorIzq, motorDer;
  @Override
  public void runOpMode() {
    motorIzq = hardwareMap.get(DcMotor.class, "motorIzq");
    motorDer = hardwareMap.get(DcMotor.class, "motorDer");
    motorDer.setDirection(DcMotor.Direction.REVERSE);
    waitForStart();
    while (opModeIsActive()) {
      double forward = -gamepad1.left_stick_y;
      double turn = gamepad1.right_stick_x;
      motorIzq.setPower(forward + turn);
      motorDer.setPower(forward - turn);
    }
  }
}
\`\`\`

Responde en español claro para jóvenes de 12-17 años. Sé motivador. Da código cuando ayude.`,

  fgc:`Eres RoboCoach, experto en programación de robots para el First Global Challenge 2026 "Igniting Innovation" para estudiantes del programa STEAM Maker de FUSALMO en El Salvador. El FGC 2026 se realizará en Incheon, República de Corea.

CAMPO: 7m×7m, SUPPRESSION UNITS (rojo y azul), EXTINGUISHER (centro), FIRE SHIELDS (esquinas), BRACES.
GAME PIECES: WILDFIRE — bolas de espuma 100mm, 500 por MATCH.
MATCH: 2 minutos 30 segundos.

PUNTUACIÓN FGC:
- WILDFIRE en SUPPRESSION UNIT: 1pt × CLIMB MULTIPLIER
- WILDFIRE en EXTINGUISHER: 1pt (toda la alianza global)
- CLIMB MULTIPLIER: base 1.0 + ZONE1=+0.10, ZONE2=+0.20, ZONE3=+0.30 por robot
- PARTNER CLIMB: 25pts por robot soportado por otro
- COOPERTITION BONUS: 4 robots ZONE3=10pts, 5=25pts, 6=40pts

Responde en español, motiva al equipo como representantes de El Salvador en Corea del Sur.`,

  debug:`Eres RoboCoach, especialista en resolución de problemas de robots para STEAM Maker FUSALMO.

DIAGNÓSTICO: 1) ¿Hardware? 2) ¿Código? 3) ¿Configuración? 4) ¿Comunicación?

PROBLEMAS COMUNES:
- Motor no responde: verificar nombre en hardwareMap, dirección, inicialización
- OpMode no aparece: verificar anotación @TeleOp/@Autonomous, compilación, WiFi
- Robot va al revés: cambiar Direction.REVERSE al motor correcto
- RunToPosition no funciona: setMode + setTargetPosition + setPower + esperar isBusy()

CÓDIGO DEBUG:
\`\`\`java
telemetry.addData("Motor Power", motorIzq.getPower());
telemetry.addData("Gamepad Y", gamepad1.left_stick_y);
telemetry.update();
\`\`\`

Responde en español con calma. Los errores son parte del aprendizaje.`,

  strategy:`Eres RoboCoach, estratega experto para STEAM Maker FUSALMO, El Salvador.

FTC DECODE PRIORIDADES:
1. AUTO: LEAVE(3) + CLASSIFIED(3c/u)
2. CLASSIFIED > OVERFLOW siempre (3 vs 1pt)
3. PATTERN: conocer MOTIF y priorizar colores correctos
4. BASE al final: 10pts + bono 10pts si ambos robots regresan = 20pts extra

FGC PRIORIDADES:
1. Máximo WILDFIRE al SUPPRESSION UNIT
2. ZONE 3 en BRACE = ×1.30 por robot (3 robots = ×1.90)
3. PARTNER CLIMB: 25pts por robot
4. COOPERTITION BONUS requiere coordinación con 6 equipos

Responde con datos y análisis. Ayuda al equipo a tomar decisiones inteligentes.`
};

const QUICK={
  ftc:["¿Cómo muevo el robot con gamepad?","Estructura TeleOp en Java","Estructura Autonomous","¿Cómo leer sensor de color?","Control de servos","Encoders y RunToPosition","¿Qué es el MOTIF?","Puntos BASE"],
  fgc:["¿Cómo inicio el código?","Recoger y soltar WILDFIRE","¿Cómo funciona el CLIMB?","Calcular puntaje máximo","Reglas importantes","¿Qué hace el HUMAN PLAYER?","Coordinación con alianza","Modo autónomo"],
  debug:["Robot no se mueve","OpMode no aparece","Error de compilación","Sensor no lee","Robot va al revés","Robot no para en auto","Problema con CLIMB","Motores se calientan"],
  strategy:["¿Qué priorizar en FTC?","Ganar RANKING POINTS","Estrategia alianza FGC","Calcular puntaje FGC","Plan BRACE","Alianza internacional","Qué practicar","Preparar AUTO period"]
};

let currentMode='ftc',history=[],isLoading=false;
let apiKey=localStorage.getItem('robocoach_key')||'';

window.onload=function(){
  if(apiKey){document.getElementById('apiModal').style.display='none';}
  setMode('ftc');
};

function saveApiKey(){
  const v=document.getElementById('apiKeyInput').value.trim();
  if(!v.startsWith('sk-ant')){alert('La API Key debe empezar con sk-ant-...');return;}
  apiKey=v;localStorage.setItem('robocoach_key',apiKey);
  document.getElementById('apiModal').style.display='none';
  setMode('ftc');
}
function changeKey(){document.getElementById('apiKeyInput').value='';document.getElementById('apiModal').style.display='flex';}

function setMode(mode){
  currentMode=mode;
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',['ftc','fgc','debug','strategy'][i]===mode));
  renderQuickBtns();history=[];
  document.getElementById('chatArea').innerHTML='';
  const W={
    ftc:`¡Hola, futuro/a ingeniero/a! 🤖\n\nEstoy listo para ayudarte con el **FTC DECODE 2025-2026**. ¿Qué necesitas trabajar hoy? Puedo ayudarte con código Java, configuración de hardware, sensores, o cualquier duda del juego. ¡El equipo de El Salvador tiene todo para brillar! 🇸🇻`,
    fgc:`¡Bienvenido/a, representante de El Salvador! 🌍🔥\n\nEl **FGC 2026 - Igniting Innovation** nos lleva a Incheon, Corea del Sur. Tu misión: meter WILDFIRE en la SUPPRESSION UNIT y trepar el BRACE para multiplicar puntos. ¿Qué quieres aprender hoy?`,
    debug:`¡Modo diagnóstico activado! 🔧\n\nCuéntame el problema:\n- ¿Qué **debería** hacer el robot?\n- ¿Qué hace **en realidad**?\n- ¿Hay algún **mensaje de error**?\n\nMientras más detalle, más rápido lo resolvemos.`,
    strategy:`¡Hora de pensar como campeones! 🏆\n\nPuedo ayudarte a planificar la estrategia ganadora para **FTC DECODE** o **FGC Igniting Innovation**. ¿Por dónde empezamos?`
  };
  addBotMsg(W[mode]);
}

function renderQuickBtns(){
  document.getElementById('quickBtns').innerHTML=QUICK[currentMode].map(q=>`<button class="qbtn" onclick="sendQuick('${q.replace(/'/g,"\\'")}')">💬 ${q}</button>`).join('');
}

function addBotMsg(text){
  const chat=document.getElementById('chatArea');
  const d=document.createElement('div');d.className='msg msg-bot';
  d.innerHTML=`<div class="avatar avatar-bot">RC</div><div class="bubble bubble-bot">${fmt(text)}</div>`;
  chat.appendChild(d);chat.scrollTop=chat.scrollHeight;
}
function addUserMsg(text){
  const chat=document.getElementById('chatArea');
  const d=document.createElement('div');d.className='msg msg-user';
  d.innerHTML=`<div class="avatar avatar-user">Tú</div><div class="bubble bubble-user">${esc(text)}</div>`;
  chat.appendChild(d);chat.scrollTop=chat.scrollHeight;
}
function showTyping(){
  const chat=document.getElementById('chatArea');
  const d=document.createElement('div');d.className='msg msg-bot';d.id='typing';
  d.innerHTML=`<div class="avatar avatar-bot">RC</div><div class="bubble bubble-bot"><div class="typing-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>`;
  chat.appendChild(d);chat.scrollTop=chat.scrollHeight;
}
function removeTyping(){const t=document.getElementById('typing');if(t)t.remove();}

function fmt(text){
  return text
    .replace(/```(\w*)\n?([\s\S]*?)```/g,(_,l,code)=>`<pre>${esc(code.trim())}</pre>`)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\n/g,'<br>');
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function sendQuick(txt){document.getElementById('userInput').value=txt;sendMessage();}
function clearChat(){history=[];setMode(currentMode);}

async function sendMessage(){
  if(isLoading||!apiKey)return;
  const input=document.getElementById('userInput');
  const text=input.value.trim();if(!text)return;
  input.value='';addUserMsg(text);history.push({role:'user',content:text});
  isLoading=true;document.getElementById('sendBtn').disabled=true;showTyping();
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:1200,system:SYSTEMS[currentMode],messages:history})
    });
    const data=await res.json();
    removeTyping();
    if(data.error){
      addBotMsg(data.error.type==='authentication_error'?'❌ API Key inválida. Haz clic en "Cambiar API Key".':'❌ Error: '+data.error.message);
    }else{
      const reply=data?.content?.[0]?.text||'Lo siento, hubo un error.';
      history.push({role:'assistant',content:reply});addBotMsg(reply);
    }
  }catch(e){removeTyping();addBotMsg('❌ Error de conexión. Verifica tu internet.');}
  isLoading=false;document.getElementById('sendBtn').disabled=false;document.getElementById('userInput').focus();
}

document.getElementById('userInput').addEventListener('keydown',e=>{if(e.key==='Enter')sendMessage();});
</script>
</body>
</html>
