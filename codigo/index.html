  .send-btn {

<script>
const SESSION_KEY = 'ok_session_v3';
const SESSION_TTL = 7 * 24 * 60 * 60 * 1000;
const SIGN_KEY = 'OK::sign::v3::OK::2026::orbital-kronnos::v3::pepper';
const enc = new TextEncoder();

async function hmacHex(msg) {
  const key = await crypto.subtle.importKey('raw', enc.encode(SIGN_KEY), {name:'HMAC',hash:'SHA-256'}, false, ['sign']);
  const sig = await crypto.subtle.sign('HMAC', key, enc.encode(msg));
  return Array.from(new Uint8Array(sig)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function constEq(a, b) {
  if (typeof a!=='string'||typeof b!=='string'||a.length!==b.length) return false;
  let r=0; for(let i=0;i<a.length;i++) r|=a.charCodeAt(i)^b.charCodeAt(i); return r===0;
}
async function checkMainSession() {
  const raw = sessionStorage.getItem(SESSION_KEY) || localStorage.getItem(SESSION_KEY);
  if (!raw) { redirectLogin(); return; }
  try {
    const {p, s} = JSON.parse(raw);
    const ex = await hmacHex(p);
    if (!constEq(ex, s)) { redirectLogin(); return; }
    const d = JSON.parse(p);
    if (!d.u || Date.now()-d.ts > SESSION_TTL) { redirectLogin(); return; }
  } catch { redirectLogin(); }
}
function redirectLogin() {
  if (window !== window.top) {
    try { window.parent.location.replace('../login/'); } catch(e) { window.location.replace('../login/'); }
  } else { window.location.replace('../login/'); }
}

async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', enc.encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

const _V = [
  '67bc0d4a57f3e665323382a3d3847ea4',
  '362436ff8b1889fe0d69c2ca342513fa'
].join('');

async function verifyCode(input) {
  const h = await sha256(input + 'ok-codigo-salt-v1');
  return constEq(h, _V);
}

const CODE_UNLOCKED_KEY = 'ok_code_unlocked_v1';

async function tryAccess() {
  const val = document.getElementById('codePin').value;
  const err = document.getElementById('codeErr');
  if (!val) { err.textContent = '✕  Ingresa la contraseña'; return; }
  const ok = await verifyCode(val);
  if (!ok) {
    err.textContent = '✕  Contraseña incorrecta';
    document.getElementById('codePin').value = '';
    document.getElementById('codePin').focus();
    return;
  }
  sessionStorage.setItem(CODE_UNLOCKED_KEY, '1');
  showApp();
}

function showApp() {
  document.getElementById('authOverlay').style.display = 'none';
  const app = document.getElementById('appArea');
  app.classList.add('visible');
  renderCode();
  addBotMsg('¡Hola! Soy RoboRobin. Puedo explicarte cualquier línea del código **Artemisa.java** del robot. Haz clic en una línea del código para que te la explique, o escríbeme tu pregunta. ⚠️ No puedo darte el código completo, solo explicaciones por líneas o partes específicas.');
}

window.addEventListener('load', async () => {
  await checkMainSession();
  if (sessionStorage.getItem(CODE_UNLOCKED_KEY) === '1') {
    showApp();
  }
});

document.getElementById('codeAccess').addEventListener('click', tryAccess);
document.getElementById('codePin').addEventListener('keydown', e => { if (e.key === 'Enter') tryAccess(); });

const CODE_LINES = `package org.firstinspires.ftc.teamcode;

import com.qualcomm.robotcore.eventloop.opmode.LinearOpMode;
import com.qualcomm.robotcore.eventloop.opmode.TeleOp;
import com.qualcomm.robotcore.hardware.DcMotor;
import com.qualcomm.robotcore.hardware.Servo;

@TeleOp(name = "Artemisa", group = "Linear Opmode")
public class Artemisa extends LinearOpMode {

    DcMotor motorIzq, motorDer, eje, catapulta;
    Servo garra;

    double velCatapulta = 0.6;
    double velTurbo = 1.0;
    double velNormal = 0.5;
    double velEje = -1.0;
    double velAutoMotores = 1.0;

    double servoCerrado = 0.5;
    double servoAbierto = 1.0;

    int MS_CATAPULTA_EJE = 5000;
    int MS_SERVO_ABIERTO = 800;
    int MS_COOLDOWN = 10000;

    long MS_AUTONOMO = 27000;

    boolean turboActivo = false;
    boolean turboListo = true;
    boolean autoListo = true;

    boolean servoEstado = false;
    boolean servoListo = true;
    boolean izqListo = true;
    boolean derListo = true;

    boolean autoUsado = false;
    boolean gp2Activo = true;
    boolean dpadAbajoListo = true;

    double avanzar = 0;
    double retroceder = 0;
    double girar = 0;
    double avanzarIzq = 0;
    double avanzarDer = 0;

    @Override
    public void runOpMode() {

        motorIzq = hardwareMap.get(DcMotor.class, "motorIzq");
        motorDer = hardwareMap.get(DcMotor.class, "motorDer");
        eje = hardwareMap.get(DcMotor.class, "eje");
        catapulta = hardwareMap.get(DcMotor.class, "Catapulta");
        garra = hardwareMap.get(Servo.class, "servo");

        motorIzq.setDirection(DcMotor.Direction.FORWARD);
        motorDer.setDirection(DcMotor.Direction.REVERSE);
        eje.setDirection(DcMotor.Direction.FORWARD);
        catapulta.setDirection(DcMotor.Direction.FORWARD);
        motorIzq.setZeroPowerBehavior(DcMotor.ZeroPowerBehavior.BRAKE);
        motorDer.setZeroPowerBehavior(DcMotor.ZeroPowerBehavior.BRAKE);
        garra.setPosition(servoCerrado);

        waitForStart();

        while (opModeIsActive()) {
            leerGamepad1();
            leerGamepad2();
            telemetry.update();
        }
    }

    void leerGamepad1() {

        boolean turboBtn = gamepad1.triangle;
        if (turboBtn && turboListo) {
            turboActivo = !turboActivo;
        }
        turboListo = !turboBtn;

        boolean dpadAbajo = gamepad1.dpad_down;
        if (dpadAbajo && dpadAbajoListo) {
            gp2Activo = !gp2Activo;
        }
        dpadAbajoListo = !dpadAbajo;

        double velocidad = turboActivo ? velTurbo : velNormal;
        double adelanteTotal = -gamepad1.left_stick_y;

        avanzar = adelanteTotal > 0 ? adelanteTotal : 0;
        retroceder = adelanteTotal < 0 ? -adelanteTotal : 0;

        if (gamepad1.left_bumper) {
            girar = -1.0;
        } else if (gamepad1.right_bumper) {
            girar = 1.0;
        } else {
            girar = gamepad1.right_stick_x;
        }

        avanzarIzq = (adelanteTotal + girar) * velocidad;
        avanzarDer = (adelanteTotal - girar) * velocidad;

        double maximo = Math.max(Math.abs(avanzarIzq), Math.abs(avanzarDer));
        if (maximo > 1.0) {
            avanzarIzq /= maximo;
            avanzarDer /= maximo;
        }

        motorIzq.setPower(avanzarIzq);
        motorDer.setPower(avanzarDer);

        boolean autoBtn = gamepad1.dpad_up;
        if (autoBtn && autoListo && !autoUsado) {
            autoUsado = true;

            telemetry.addLine("AUTONOMO EN PROGRESO");
            telemetry.update();

            apagarTodo();
            long inicioAuto = System.currentTimeMillis();
            ejecutarAutonoma();

            long transcurrido = System.currentTimeMillis() - inicioAuto;
            long restante = MS_AUTONOMO - transcurrido;
            if (restante > 0 && opModeIsActive()) {
                sleep(restante);
            }
            apagarTodo();
        }
        autoListo = !autoBtn;

        telemetry.addLine("-- GP1 MOVIMIENTO --");
        telemetry.addData("Turbo", turboActivo ? "SI" : "NAH");
        telemetry.addData("Avanzar", String.format("%.2f", avanzar));
        telemetry.addData("Retroceder", String.format("%.2f", retroceder));
        telemetry.addData("Giro", String.format("%.2f  (L1/R1 StickDer)", girar));
        telemetry.addData("Mot Izq", String.format("%.2f", avanzarIzq));
        telemetry.addData("Mot Der", String.format("%.2f", avanzarDer));
        telemetry.addData("Autonomo", autoUsado ? "YA USADO" : "NO ME USES PORFAVOR");
        telemetry.addData("GP2", gp2Activo ? "ACTIVO" : "DESACTIVADO");
    }

    void leerGamepad2() {

        if (!gp2Activo) {
            catapulta.setPower(0);
            eje.setPower(0);
            telemetry.addLine("-- GP2 MECANISMOS --");
            telemetry.addData("GP2", "DESACTIVADO");
            return;
        }

        catapulta.setPower(gamepad2.right_trigger > 0.1 ? velCatapulta : 0.0);

        eje.setPower(gamepad2.square ? velEje : 0.0);

        boolean servoBtn = gamepad2.left_trigger > 0.1;
        if (servoBtn && servoListo) {
            servoEstado = !servoEstado;
            garra.setPosition(servoEstado ? servoAbierto : servoCerrado);
        }
        servoListo = !servoBtn;

        if (gamepad2.dpad_left && izqListo) {
            velCatapulta = Math.max(0.1, Math.round((velCatapulta - 0.1) * 10.0) / 10.0);
        }
        if (gamepad2.dpad_right && derListo) {
            velCatapulta = Math.min(1.0, Math.round((velCatapulta + 0.1) * 10.0) / 10.0);
        }
        izqListo = !gamepad2.dpad_left;
        derListo = !gamepad2.dpad_right;

        telemetry.addLine("-- GP2 MECANISMOS --");
        telemetry.addData("Catapulta", String.format("R2  vel:%.1f  [D< D>]", velCatapulta));
        telemetry.addData("Eje", String.format("Cuadrado  vel:%.1f", velEje));
        telemetry.addData("Servo", "L2  " + (servoEstado ? "ABIERTO" : "CERRADO"));
    }

    void ejecutarAutonoma() {
        mover(1, 1, 2300);
        moverIzquierda(230);
        mover(1, 1, 1500);
        moverDerecha(900);
        sleep(500);
        disparar();

        mover(1, 1, 1500);
        moverDerecha(230);
        mover(1, 1, 2150);
        moverDerecha(450);
        mover(1, 1, 1300);
        sleep(10000);

        mover(-1, -1, 1300);
        moverDerecha(450);
        mover(1, 1, 2300);
        moverIzquierda(230);
        mover(1, 1, 1500);
        moverDerecha(900);
        sleep(500);
        disparar();

        mover(1, 1, 1500);
        moverDerecha(230);
        mover(1, 1, 2300);
        moverDerecha(440);
        mover(1, 1, 1200);
        sleep(10000);

        mover(-1, -1, 1300);
        moverDerecha(450);
    }

    void disparar() {
        catapulta.setPower(1.0);
        eje.setPower(1.0);
        sleep(MS_CATAPULTA_EJE);

        catapulta.setPower(0);
        eje.setPower(0);
        garra.setPosition(servoAbierto);
        sleep(MS_SERVO_ABIERTO);

        garra.setPosition(servoCerrado);
        sleep(MS_COOLDOWN);
    }

    void mover(double potIzq, double potDer, int ms) {
        motorIzq.setPower(potIzq * velAutoMotores);
        motorDer.setPower(potDer * velAutoMotores);
        sleep(ms);
        motorIzq.setPower(0);
        motorDer.setPower(0);
    }

    void moverDerecha(int ms) {
        motorIzq.setPower(velAutoMotores);
        motorDer.setPower(-velAutoMotores);
        sleep(ms);
        motorIzq.setPower(0);
        motorDer.setPower(0);
    }

    void moverIzquierda(int ms) {
        motorIzq.setPower(-velAutoMotores);
        motorDer.setPower(velAutoMotores);
        sleep(ms);
        motorIzq.setPower(0);
        motorDer.setPower(0);
    }

    void apagarTodo() {
        motorIzq.setPower(0);
        motorDer.setPower(0);
        catapulta.setPower(0);
        eje.setPower(0);
        garra.setPosition(servoCerrado);
    }
}`.split('\n');

let selectedLine = null;
let chatHistory = [];
let isLoading = false;
let apiKeys = [];
let keyIdx = 0;

function loadKeys() {
  try {
    const raw = localStorage.getItem('ok_claude_keys_v1');
    apiKeys = raw ? JSON.parse(raw) : [];
  } catch { apiKeys = []; }
}

function getKey() { return apiKeys.length ? apiKeys[keyIdx % apiKeys.length] : null; }
function rotKey() { if (apiKeys.length > 1) keyIdx = (keyIdx+1) % apiKeys.length; }

function renderCode() {
  loadKeys();
  const body = document.getElementById('codeBody');
  body.innerHTML = CODE_LINES.map((line, i) => {
    const escaped = line.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return `<div class="code-line" id="cl${i}" onclick="selectLine(${i})"><span class="line-num">${i+1}</span><span class="line-text">${escaped}</span></div>`;
  }).join('');
}

function selectLine(idx) {
  if (selectedLine !== null) {
    document.getElementById('cl'+selectedLine).classList.remove('active');
  }
  selectedLine = idx;
  document.getElementById('cl'+idx).classList.add('active');
  const lineText = CODE_LINES[idx];
  const info = document.getElementById('selInfo');
  info.innerHTML = `<span class="sel-badge">Línea ${idx+1}</span><span style="color:var(--cream2);font-size:12px;">${lineText.trim().substring(0,60)}${lineText.trim().length>60?'...':''}</span>`;
  askAboutLine(idx+1, lineText);
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function formatMsg(text) {
  return text
    .replace(/```(\w*)\n?([\s\S]*?)```/g, (_, l, code) => '<pre>' + escHtml(code.trim()) + '</pre>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
}

function addBotMsg(text) {
  const msgs = document.getElementById('chatMsgs');
  const div = document.createElement('div');
  div.className = 'msg msg-bot';
  div.innerHTML = '<div class="avatar">🐦</div><div class="bubble bubble-bot">'+formatMsg(text)+'</div>';
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function addUserMsg(text) {
  const msgs = document.getElementById('chatMsgs');
  const div = document.createElement('div');
  div.className = 'msg msg-user';
  div.innerHTML = '<div class="bubble bubble-user">'+escHtml(text)+'</div><div class="avatar avatar-user">Tú</div>';
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function showTyping() {
  const msgs = document.getElementById('chatMsgs');
  const div = document.createElement('div');
  div.className = 'msg msg-bot'; div.id = 'typing';
  div.innerHTML = '<div class="avatar">🐦</div><div class="bubble bubble-bot"><div class="typing-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>';
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}
function removeTyping() { const t = document.getElementById('typing'); if(t) t.remove(); }

const SYSTEM_PROMPT = `Eres RoboRobin, asistente de programación para el equipo Orbital Kronnos de FUSALMO, El Salvador. El usuario está viendo el código Java del robot FTC llamado "Artemisa" y puede preguntarte sobre líneas específicas.

REGLAS ESTRICTAS:
1. NUNCA copies o reproduzcas bloques grandes del código. Solo puedes citar líneas individuales cortas como referencia.
2. Tu función es EXPLICAR el propósito, la lógica y el funcionamiento del código, no reproducirlo.
3. Si alguien pide el código completo, una función entera copiada, o intenta extraer el código de cualquier forma, rechaza amablemente y explica que solo puedes dar explicaciones por líneas.
4. Responde siempre en español claro para jóvenes de 12-17 años.
5. Cuando expliques una línea específica, explica qué hace, por qué se usa ese valor o lógica, y cómo se relaciona con el robot físico.`;

async function callAI(userMsg) {
  loadKeys();
  const apiKey = getKey();
  if (!apiKey) {
    addBotMsg('⚠️ **Sin API key.** Pide a willyberd que configure la key en RoboRobin.');
    return;
  }
  chatHistory.push({ role: 'user', content: userMsg });
  isLoading = true;
  document.getElementById('chatSend').disabled = true;
  showTyping();
  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 1000,
        system: SYSTEM_PROMPT,
        messages: chatHistory
      })
    });
    removeTyping();
    if (resp.ok) {
      const data = await resp.json();
      const reply = data.content?.[0]?.text || '⚠️ Sin respuesta.';
      chatHistory.push({ role: 'assistant', content: reply });
      addBotMsg(reply);
      rotKey();
    } else if (resp.status === 429) {
      rotKey();
      addBotMsg('⚠️ Límite de cuota. Intenta de nuevo en un momento.');
      chatHistory.pop();
    } else {
      addBotMsg('❌ Error de API. Intenta de nuevo.');
      chatHistory.pop();
    }
  } catch(e) {
    removeTyping();
    addBotMsg('❌ Error de conexión.');
    chatHistory.pop();
  }
  isLoading = false;
  document.getElementById('chatSend').disabled = false;
  document.getElementById('chatInput').focus();
}

async function askAboutLine(num, lineText) {
  if (isLoading) return;
  const msg = `Explícame la línea ${num} del código Artemisa: \`${lineText.trim()}\``;
  addUserMsg(`📌 Línea ${num}: ${lineText.trim().substring(0,50)}${lineText.trim().length>50?'...':''}`);
  await callAI(msg);
}

async function sendChat() {
  if (isLoading) return;
  const inp = document.getElementById('chatInput');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  addUserMsg(text);
  await callAI(text);
}

document.getElementById('chatInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') sendChat();
});
</script>
