<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RoboRobin — Orbital Kronnos</title>
<link rel="icon" href="../images/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --cream:  #F5EBD6;
  --cream2: #d8cdb3;
  --gold:   #E2BF6E;
  --gold2:  #C9A14A;
  --gold3:  #B07D3B;
  --dark:   #0a0807;
  --dark2:  #161210;
  --glow:   rgba(226,191,110,0.22);
  --fd: "Orbitron","Cinzel",sans-serif;
  --fs: "Cinzel",serif;
  --fb: "Cormorant Garamond",Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;height:100vh;}
body{
  background:var(--dark);
  color:var(--cream);
  font-family:var(--fb);
  font-size:16px;
  line-height:1.6;
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}

/* BG */
.bg{position:fixed;inset:0;z-index:0;background:url('../images/fondo.png') center/cover no-repeat;filter:brightness(0.28) contrast(1.05);}
.bgo{position:fixed;inset:0;z-index:1;background:radial-gradient(ellipse at 50% 0%,rgba(201,161,74,.1),transparent 60%),linear-gradient(180deg,rgba(10,8,7,.72),rgba(10,8,7,.45) 50%,rgba(10,8,7,.88));}

/* HEADER */
.hdr{position:relative;z-index:10;padding:20px 40px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--glow);background:rgba(10,8,7,.8);backdrop-filter:blur(12px);}
.hdr-logo{font-family:var(--fd);font-weight:900;font-size:17px;letter-spacing:4px;color:var(--gold);}
.hdr-logo em{font-style:normal;}
.hdr-right{display:flex;align-items:center;gap:20px;}
.hdr-user{font-family:var(--fd);font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--cream2);}
.hdr-btn{font-family:var(--fd);font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--cream2);border:1px solid var(--glow);padding:8px 18px;cursor:pointer;background:transparent;transition:all .25s;}
.hdr-btn:hover{color:var(--gold);border-color:var(--gold);}

/* MAIN CONTAINER */
main{position:relative;z-index:5;flex:1;display:flex;overflow:hidden;}

/* API KEY MODAL */
#apiModal{display:flex;position:fixed;inset:0;z-index:100;align-items:center;justify-content:center;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);}
#apiModal.hidden{display:none;}
.modal-box{background:rgba(14,11,10,.95);border:1px solid var(--glow);padding:40px;max-width:500px;text-align:center;}
.modal-title{font-family:var(--fd);font-size:20px;font-weight:900;letter-spacing:3px;margin-bottom:16px;color:var(--gold);}
.modal-text{color:var(--cream2);margin-bottom:24px;font-size:15px;line-height:1.8;}
.modal-input{width:100%;padding:12px 16px;background:rgba(10,8,7,.8);border:1px solid var(--glow);color:var(--cream);font-family:var(--fb);font-size:14px;margin-bottom:16px;outline:none;}
.modal-input:focus{border-color:var(--gold);background:rgba(20,17,15,.95);}
.modal-btns{display:flex;gap:12px;}
.modal-btn{flex:1;padding:12px;background:linear-gradient(180deg,var(--gold),var(--gold3));color:var(--dark);font-family:var(--fd);font-weight:700;font-size:11px;letter-spacing:3px;border:none;cursor:pointer;transition:all .25s;}
.modal-btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(201,161,74,.3);}
.modal-btn.cancel{background:transparent;color:var(--cream2);border:1px solid var(--glow);}
.modal-btn.cancel:hover{border-color:var(--gold);color:var(--gold);}

/* SIDEBAR */
.sidebar{width:280px;background:rgba(14,11,10,.95);border-right:1px solid var(--glow);display:flex;flex-direction:column;overflow-y:auto;}
.sidebar-top{padding:20px;border-bottom:1px solid var(--glow);}
.mode-label{font-family:var(--fd);font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--gold);margin-bottom:12px;display:block;}
.tabs{display:flex;flex-direction:column;gap:8px;}
.tab{padding:12px 16px;background:transparent;border:1px solid var(--glow);color:var(--cream2);font-family:var(--fd);font-size:12px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all .25s;text-align:left;}
.tab:hover{border-color:var(--gold);color:var(--gold);}
.tab.active{background:linear-gradient(180deg,var(--gold),var(--gold3));color:var(--dark);border-color:var(--gold);}

.quick-btns{flex:1;padding:20px;overflow-y:auto;}
.qbtn-label{font-family:var(--fd);font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--gold);margin:16px 0 8px;display:block;}
.qbtn{width:100%;padding:10px 12px;background:rgba(226,191,110,.08);border:1px solid rgba(226,191,110,.15);color:var(--cream2);font-family:var(--fb);font-size:13px;text-align:left;cursor:pointer;transition:all .25s;margin-bottom:6px;border-radius:2px;}
.qbtn:hover{background:rgba(226,191,110,.15);border-color:var(--gold);color:var(--gold);}

.sidebar-bot{padding:20px;border-top:1px solid var(--glow);display:flex;flex-direction:column;gap:8px;}
.clear-btn{padding:10px;background:transparent;border:1px solid var(--glow);color:var(--cream2);font-family:var(--fd);font-size:10px;letter-spacing:2px;cursor:pointer;transition:all .25s;}
.clear-btn:hover{border-color:#c0392b;color:#c0392b;}
.key-btn{padding:10px;background:linear-gradient(180deg,var(--gold),var(--gold3));color:var(--dark);font-family:var(--fd);font-size:10px;letter-spacing:2px;font-weight:700;border:none;cursor:pointer;transition:all .25s;}
.key-btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(201,161,74,.3);}

/* CHAT AREA */
.chat-wrap{flex:1;display:flex;flex-direction:column;background:rgba(10,8,7,.5);}
#chatArea{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:16px;}
.msg{display:flex;gap:12px;animation:sin .3s ease-out;}
@keyframes sin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:11px;font-weight:700;letter-spacing:1px;flex-shrink:0;}
.avatar-bot{background:linear-gradient(180deg,var(--gold),var(--gold3));color:var(--dark);}
.avatar-user{background:rgba(226,191,110,.2);border:1px solid var(--glow);color:var(--gold);}
.bubble{max-width:70%;padding:12px 16px;border-radius:8px;font-size:15px;line-height:1.5;}
.bubble-bot{background:rgba(226,191,110,.08);border:1px solid rgba(226,191,110,.2);color:var(--cream);}
.bubble-user{background:rgba(226,191,110,.15);border:1px solid var(--glow);color:var(--cream);}
.bubble code{background:rgba(0,0,0,.3);padding:2px 6px;border-radius:3px;font-family:monospace;font-size:13px;}
.bubble pre{background:rgba(0,0,0,.4);padding:12px;border-radius:4px;overflow-x:auto;margin:8px 0;font-family:monospace;font-size:12px;}
.bubble strong{color:var(--gold);}
.msg-user{justify-content:flex-end;}
.msg-user .bubble{max-width:70%;}

.typing-dots{display:flex;gap:4px;}
.typing-dots .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:dop .6s infinite;}
.typing-dots .dot:nth-child(2){animation-delay:.1s;}
.typing-dots .dot:nth-child(3){animation-delay:.2s;}
@keyframes dop{0%,60%{opacity:.3;}80%,100%{opacity:1;}}

/* CHAT INPUT */
.chat-input{position:relative;z-index:5;padding:16px 20px;border-top:1px solid var(--glow);background:rgba(10,8,7,.8);backdrop-filter:blur(8px);display:flex;gap:12px;}
.inp-row{flex:1;display:flex;gap:8px;}
#userInput{flex:1;padding:12px 14px;background:rgba(10,8,7,.8);border:1px solid var(--glow);color:var(--cream);font-family:var(--fb);font-size:15px;outline:none;transition:border-color .25s,box-shadow .25s;}
#userInput:focus{border-color:var(--gold);background:rgba(20,17,15,.95);box-shadow:0 0 12px rgba(201,161,74,.1);}
#userInput::placeholder{color:rgba(216,205,179,.3);}
#sendBtn{padding:12px 24px;background:linear-gradient(180deg,var(--gold),var(--gold3));color:var(--dark);font-family:var(--fd);font-weight:700;font-size:11px;letter-spacing:3px;text-transform:uppercase;border:none;cursor:pointer;transition:all .25s;}
#sendBtn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 16px rgba(201,161,74,.3);}
#sendBtn:disabled{opacity:.5;cursor:not-allowed;}

/* RESPONSIVE */
@media(max-width:1024px){
  .sidebar{width:240px;}
  .bubble{max-width:80%;}
}
@media(max-width:768px){
  .sidebar{position:absolute;left:0;top:0;height:100%;z-index:20;}
  main{flex-direction:column;}
  .hdr{flex-wrap:wrap;}
}
@media(max-width:520px){
  .hdr{padding:16px;}
  .sidebar{display:none;}
  #chatArea{padding:16px;}
  .bubble{max-width:100%;}
}
</style>
</head>
<body>

<div class="bg"></div>
<div class="bgo"></div>

<header class="hdr">
  <span class="hdr-logo">ORBITAL <em>KRONNOS</em> — <strong style="color:var(--gold);">RoboRobin</strong></span>
  <div class="hdr-right">
    <span class="hdr-user" id="hdrUser">Cargando...</span>
    <button class="hdr-btn" onclick="doLogout()">← Salir</button>
  </div>
</header>

<!-- API KEY MODAL -->
<div id="apiModal">
  <div class="modal-box">
    <div class="modal-title">API Key de Claude</div>
    <p class="modal-text">Para usar RoboCoach, necesitas una API Key de Anthropic (Claude). <a href="https://console.anthropic.com/" target="_blank" style="color:var(--gold);">Obtén tu API Key aquí</a></p>
    <input type="password" id="apiKeyInput" class="modal-input" placeholder="sk-ant-..." />
    <div class="modal-btns">
      <button class="modal-btn cancel" onclick="closeApiModal()">Cancelar</button>
      <button class="modal-btn" onclick="saveApiKey()">Guardar</button>
    </div>
  </div>
</div>

<main>
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-top">
      <label class="mode-label">— Modo —</label>
      <div class="tabs">
        <button class="tab active" onclick="setMode('ftc')">⚙️ FTC DECODE</button>
        <button class="tab" onclick="setMode('fgc')">🌍 FGC 2026</button>
        <button class="tab" onclick="setMode('debug')">🔧 Debug</button>
        <button class="tab" onclick="setMode('strategy')">🏆 Estrategia</button>
      </div>
    </div>

    <div class="quick-btns">
      <label class="qbtn-label">— Rápidos —</label>
      <div id="quickBtns"></div>
    </div>

    <div class="sidebar-bot">
      <button class="clear-btn" onclick="clearChat()">🗑️ Limpiar chat</button>
      <button class="key-btn" onclick="changeKey()">🔑 Cambiar API Key</button>
    </div>
  </aside>

  <!-- CHAT -->
  <div class="chat-wrap">
    <div id="chatArea"></div>
    <div class="chat-input">
      <div class="inp-row">
        <input type="text" id="userInput" placeholder="Escribe tu pregunta..." autocomplete="off" />
      </div>
      <button id="sendBtn" onclick="sendMessage()">Enviar</button>
    </div>
  </div>
</main>

<script>
/* Guardia de sesión – compatible con el login firmado v3 */
(async function(){
  const SESSION_KEY = 'ok_session_v3';
  const PEPPER = 'OK::2026::orbital-kronnos::v3::pepper';
  const SIGN_KEY = 'OK::sign::v3::' + PEPPER;
  const TTL = 7 * 24 * 60 * 60 * 1000;
  const enc = new TextEncoder();
  const raw = sessionStorage.getItem(SESSION_KEY) || localStorage.getItem(SESSION_KEY);
  const bail = () => {
    sessionStorage.removeItem(SESSION_KEY);
    localStorage.removeItem(SESSION_KEY);
    window.location.replace('../login/');
  };
  if (!raw) return bail();
  try{
    const { p, s } = JSON.parse(raw);
    const key = await crypto.subtle.importKey('raw', enc.encode(SIGN_KEY), {name:'HMAC',hash:'SHA-256'}, false, ['sign']);
    const sigBuf = await crypto.subtle.sign('HMAC', key, enc.encode(p));
    const sig = Array.from(new Uint8Array(sigBuf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    if (sig !== s) return bail();
    const data = JSON.parse(p);
    if (!data.u || Date.now() - data.ts > TTL) return bail();
    const hu = document.getElementById('hdrUser');
    if (hu) hu.textContent = data.u;
    window.__OK_USER__ = data.u;
  } catch { bail(); }
})();
function doLogout(){
  sessionStorage.removeItem('ok_session_v3');
  localStorage.removeItem('ok_session_v3');
  window.location.replace('../login/');
}
</script>
<script src="roborobin.js"></script>
</body>
</html>
