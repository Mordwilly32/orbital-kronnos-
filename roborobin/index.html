<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoboRobin STEAM Maker – FUSALMO</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <div class="logo-circle">
    <img src="../images/robin.png" alt="RoboRobin Logo">
  </div>
  <div class="header-text">
    <h1>RoboRobin – STEAM Maker FUSALMO</h1>
    <p>Asistente de programación · Competición Nacional 2026</p>
  </div>
  <div class="badges">
    <span class="badge badge-ftc">FTC</span>
    <span class="badge badge-fgc">FGC</span>
  </div>
</header>

<div class="app-body">
  <div class="mode-tabs">
    <button class="tab active" onclick="setMode('ftc')">🐦 FTC · DECODE</button>
    <button class="tab" onclick="setMode('fgc')">🌍 FGC · Igniting Innovation</button>
    <button class="tab" onclick="setMode('debug')">🔧 Debug &amp; Errores</button>
    <button class="tab" onclick="setMode('strategy')">🏆 Estrategia</button>
  </div>

  <div class="chat-area" id="chatArea"></div>

  <div class="quick-section" id="quickBtns"></div>

  <div class="input-row">
    <input type="text" id="userInput"
           placeholder="Escribe tu pregunta a RoboRobin..."
           autocomplete="off" />
    <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="Enviar">
      <svg viewBox="0 0 24 24">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>

  <div class="calc-section">
    <span>💡 Powered by Claude Haiku 4.5</span>
    <button class="calc-btn" onclick="clearChat()">Nueva conversación</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
