<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orbital Kronnos — Acceso</title>
<link rel="icon" href="../images/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<meta name="referrer" content="no-referrer">
<style>
:root {
  --cream:  #F5EBD6;
  --cream2: #d8cdb3;
  --gold:   #E2BF6E;
  --gold2:  #C9A14A;
  --gold3:  #B07D3B;
  --dark:   #0a0807;
  --dark2:  #161210;
  --glow:   rgba(226,191,110,0.22);
  --fd: "Orbitron","Cinzel",sans-serif;
  --fs: "Cinzel",serif;
  --fb: "Cormorant Garamond",Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  background:var(--dark);
  color:var(--cream);
  font-family:var(--fb);
  font-size:18px;
  line-height:1.65;
  min-height:100vh;
  overflow-x:hidden;
  display:flex;
  flex-direction:column;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}

.bg{position:fixed;inset:0;z-index:0;background:url('../images/fondo.png') center/cover no-repeat;filter:brightness(0.28) contrast(1.05);animation:bz 20s ease-in-out infinite alternate;}
@keyframes bz{from{transform:scale(1);}to{transform:scale(1.07);}}
.bgo{position:fixed;inset:0;z-index:1;background:radial-gradient(ellipse at 50% 0%,rgba(201,161,74,.1),transparent 60%),linear-gradient(180deg,rgba(10,8,7,.72),rgba(10,8,7,.45) 50%,rgba(10,8,7,.88));}

.hdr{position:relative;z-index:10;padding:20px 40px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--glow);background:rgba(10,8,7,.6);backdrop-filter:blur(12px);}
.hdr-logo{font-family:var(--fd);font-weight:900;font-size:17px;letter-spacing:4px;color:var(--gold);}
.hdr-logo em{font-style:normal;}
.hdr-back{font-family:var(--fd);font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--cream2);border:1px solid var(--glow);padding:8px 18px;transition:all .25s;}
.hdr-back:hover{color:var(--gold);border-color:var(--gold);}

main{position:relative;z-index:5;flex:1;display:flex;align-items:center;justify-content:center;padding:60px 24px;}

.card{width:100%;max-width:460px;background:rgba(14,11,10,.92);border:1px solid var(--glow);backdrop-filter:blur(18px);padding:52px 46px 46px;position:relative;animation:cin .75s ease-out both;}
@keyframes cin{from{opacity:0;transform:translateY(28px);}to{opacity:1;transform:translateY(0);}}
.card::before{content:"";position:absolute;top:0;left:12%;right:12%;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);}
.card::after{content:"";position:absolute;bottom:0;left:12%;right:12%;height:1px;background:linear-gradient(90deg,transparent,var(--glow),transparent);}

.robin-header{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:28px;padding-bottom:24px;border-bottom:1px solid var(--glow);}
.robin-header img{width:64px;height:64px;object-fit:contain;filter:drop-shadow(0 0 18px rgba(226,191,110,0.4));}
.robin-header-text{}
.robin-header-name{font-family:var(--fd);font-weight:900;font-size:18px;letter-spacing:3px;background:linear-gradient(180deg,#f0d488,var(--gold) 50%,var(--gold3));-webkit-background-clip:text;background-clip:text;color:transparent;text-transform:uppercase;}
.robin-header-sub{font-family:var(--fb);font-size:13px;font-style:italic;color:var(--cream2);margin-top:2px;}

.eyebrow{font-family:var(--fd);font-size:10px;letter-spacing:6px;color:var(--gold);text-transform:uppercase;text-align:center;margin-bottom:14px;display:flex;align-items:center;gap:10px;justify-content:center;}
.eyebrow::before,.eyebrow::after{content:"";flex:1;height:1px;background:var(--glow);max-width:44px;}
.card-title{font-family:var(--fd);font-weight:900;font-size:26px;letter-spacing:3px;text-align:center;margin-bottom:6px;background:linear-gradient(180deg,#f0d488,var(--gold) 50%,var(--gold3));-webkit-background-clip:text;background-clip:text;color:transparent;text-transform:uppercase;}
.card-sub{text-align:center;font-style:italic;color:var(--cream2);font-size:16px;margin-bottom:36px;}

.lbl{display:block;font-family:var(--fd);font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--gold);margin-bottom:8px;}
.inp{width:100%;padding:13px 16px;background:rgba(10,8,7,.8);border:1px solid var(--glow);color:var(--cream);font-family:var(--fb);font-size:17px;outline:none;transition:border-color .25s,box-shadow .25s;margin-bottom:20px;}
.inp::placeholder{color:rgba(216,205,179,.35);}
.inp:focus{border-color:var(--gold);background:rgba(20,17,15,.95);box-shadow:0 0 18px rgba(201,161,74,.13);}

.remember-row{display:flex;align-items:center;gap:10px;margin-bottom:22px;cursor:pointer;user-select:none;}
.remember-row input[type="checkbox"]{appearance:none;-webkit-appearance:none;width:18px;height:18px;border:1px solid var(--glow);background:rgba(10,8,7,.8);cursor:pointer;position:relative;flex-shrink:0;transition:border-color .25s,background .25s;}
.remember-row input[type="checkbox"]:checked{background:linear-gradient(180deg,var(--gold),var(--gold3));border-color:var(--gold);}
.remember-row input[type="checkbox"]:checked::after{content:"✓";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:var(--dark);font-size:12px;font-weight:900;font-family:var(--fd);}
.remember-row span{font-family:var(--fd);font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--cream2);}

.captcha-wrap{display:flex;justify-content:center;margin-bottom:20px;}
.captcha-wrap .g-recaptcha{transform:scale(0.92);transform-origin:center top;}

.err{font-family:var(--fd);font-size:10px;letter-spacing:2px;color:#c0392b;text-align:center;min-height:16px;margin-bottom:16px;text-transform:uppercase;}

.btn{width:100%;padding:15px;background:linear-gradient(180deg,var(--gold),var(--gold3));color:var(--dark);font-family:var(--fd);font-weight:700;font-size:11px;letter-spacing:5px;text-transform:uppercase;border:none;cursor:pointer;transition:transform .25s,box-shadow .25s;box-shadow:0 8px 24px rgba(201,161,74,.2);}
.btn:hover{transform:translateY(-3px);box-shadow:0 14px 36px rgba(201,161,74,.45);}
.btn:active{transform:translateY(0);}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}

.checking{display:none;flex-direction:column;align-items:center;gap:16px;padding:40px 0;}
.checking.show{display:flex;}
.spinner{width:36px;height:36px;border:2px solid var(--glow);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.checking p{font-family:var(--fd);font-size:10px;letter-spacing:4px;color:var(--cream2);text-transform:uppercase;}

.orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:2;}
.o1{width:380px;height:380px;background:radial-gradient(circle,rgba(201,161,74,.08),transparent 70%);top:-100px;right:-80px;animation:of 13s ease-in-out infinite alternate;}
.o2{width:280px;height:280px;background:radial-gradient(circle,rgba(201,161,74,.06),transparent 70%);bottom:5%;left:-70px;animation:of 17s 4s ease-in-out infinite alternate;}
@keyframes of{from{transform:translate(0,0);}to{transform:translate(28px,18px);}}

footer{position:relative;z-index:5;text-align:center;padding:20px;font-size:13px;color:var(--cream2);font-style:italic;border-top:1px solid var(--glow);background:rgba(10,8,7,.5);}

@media(max-width:520px){
  .card{padding:38px 20px 32px;}
  .hdr{padding:16px 20px;}
  .captcha-wrap .g-recaptcha{transform:scale(0.82);transform-origin:center top;}
}
</style>
</head>
<body>

<div class="bg"></div>
<div class="bgo"></div>
<div class="orb o1"></div>
<div class="orb o2"></div>

<header class="hdr">
  <span class="hdr-logo">ORBITAL <em>KRONNOS</em></span>
  <a href="../" class="hdr-back">← Volver al inicio</a>
</header>

<main id="loginSection">
  <div class="card">
    <div class="checking" id="checkingDiv">
      <div class="spinner"></div>
      <p>Verificando sesión…</p>
    </div>

    <div id="loginForm">
      <div class="eyebrow">— Acceso —</div>
      <h1 class="card-title">Iniciar Sesión</h1>
      <p class="card-sub">Ingresa tus credenciales del equipo</p>

      <label class="lbl" for="usr">Usuario</label>
      <input class="inp" type="text" id="usr" placeholder="tu_usuario" autocomplete="username" />

      <label class="lbl" for="pwd">Contraseña</label>
      <input class="inp" type="password" id="pwd" placeholder="••••••••" autocomplete="current-password" />

      <label class="remember-row">
        <input type="checkbox" id="rememberMe" />
        <span>Mantener sesión iniciada</span>
      </label>

      <div class="err" id="errMsg"></div>
      <button class="btn" id="loginBtn">Entrar ›</button>
    </div>
  </div>
</main>

<footer>© 2026 Orbital Kronnos · STEAM Maker Challenge · El Salvador</footer>

<script>
/* ───────── Auth Orbital Kronnos ─────────
   Nota de seguridad (sitio estático en GitHub Pages):
   No hay backend, así que la verificación corre en el navegador.
   Mejoras aplicadas vs. la versión anterior:
   • SHA-256 reforzado con PBKDF2 (150k iteraciones) + sal por usuario + pepper global
     → inutiliza tablas arcoíris y vuelve los hashes filtrados ~10⁵× más caros de romper.
   • Comparación en tiempo constante (evita timing attacks).
   • Bloqueo progresivo tras intentos fallidos.
   • sessionStorage por defecto (la sesión muere al cerrar la pestaña),
     localStorage SOLO si marcan "mantener sesión iniciada".
   • Sesión firmada con HMAC para que no se pueda inyectar manualmente.
   Para seguridad real (no rompible viendo el código) hace falta un backend.
   ─────────────────────────────────────── */

const PEPPER = 'OK::2026::orbital-kronnos::v3::pepper';
const SIGN_KEY = 'OK::sign::v3::' + PEPPER;

/* hashes existentes = SHA-256(password). Se mantienen para no perder cuentas.
   La sal por-usuario refuerza la verificación PBKDF2 sobre ese hash. */
const ACCOUNTS = [
  { username:'willyberd', salt:'wbrd-9f3a-okx', hash:'f50f07af8a74b6092241c5c66ba72be5a10b9ce2ccf170b33d38084d1dc33cc0', role:'member', display:'willyberd' },
  { username:'Chigiri',   salt:'chgr-7c1e-okx', hash:'3ca9b3b65659a0537cb5331a2ea3c8beb6c7e1030a47d924980581f247ceae30', role:'member', display:'Chigiri'   },
  { username:'Rhis',      salt:'rhis-2d8b-okx', hash:'e9327696e626fdfd0fb06e64475791d31343b1332f9bb276600e9842ea538be8', role:'member', display:'Rhis'      }
];

const SESSION_KEY  = 'ok_session_v3';
const SESSION_TTL  = 7 * 24 * 60 * 60 * 1000;
const LOCKOUT_KEY  = 'ok_lockout_v3';
const MAX_ATTEMPTS = 5;
const LOCKOUT_MS   = 60 * 1000;

const enc = new TextEncoder();

async function sha256Hex(str){
  const buf = await crypto.subtle.digest('SHA-256', enc.encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function pbkdf2Hex(material, salt, iters=150000, bits=256){
  const key = await crypto.subtle.importKey('raw', enc.encode(material), 'PBKDF2', false, ['deriveBits']);
  const out = await crypto.subtle.deriveBits(
    { name:'PBKDF2', salt: enc.encode(salt), iterations: iters, hash:'SHA-256' },
    key, bits
  );
  return Array.from(new Uint8Array(out)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function hmacHex(msg){
  const key = await crypto.subtle.importKey('raw', enc.encode(SIGN_KEY), {name:'HMAC',hash:'SHA-256'}, false, ['sign']);
  const sig = await crypto.subtle.sign('HMAC', key, enc.encode(msg));
  return Array.from(new Uint8Array(sig)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function constEq(a, b){
  if (typeof a !== 'string' || typeof b !== 'string' || a.length !== b.length) return false;
  let r = 0; for (let i=0;i<a.length;i++) r |= a.charCodeAt(i) ^ b.charCodeAt(i);
  return r === 0;
}

/* Hash final que comparamos: PBKDF2(sha256(password) + pepper, salt) */
async function deriveCompare(password, salt){
  const base = await sha256Hex(password);
  return pbkdf2Hex(base + ':' + PEPPER, salt);
}
async function expectedFromAccount(acc){
  return pbkdf2Hex(acc.hash + ':' + PEPPER, acc.salt);
}

/* ─── Sesión firmada ─── */
async function saveSession(username, remember){
  const payload = { u: username, ts: Date.now() };
  const body = JSON.stringify(payload);
  const sig = await hmacHex(body);
  const blob = JSON.stringify({ p: body, s: sig });
  (remember ? localStorage : sessionStorage).setItem(SESSION_KEY, blob);
  (remember ? sessionStorage : localStorage).removeItem(SESSION_KEY);
}
async function getSavedSession(){
  const raw = sessionStorage.getItem(SESSION_KEY) || localStorage.getItem(SESSION_KEY);
  if (!raw) return null;
  try{
    const { p, s } = JSON.parse(raw);
    const expect = await hmacHex(p);
    if (!constEq(expect, s)) { clearSession(); return null; }
    const data = JSON.parse(p);
    if (!data.u || Date.now() - data.ts > SESSION_TTL){ clearSession(); return null; }
    return data;
  } catch { clearSession(); return null; }
}
function clearSession(){
  sessionStorage.removeItem(SESSION_KEY);
  localStorage.removeItem(SESSION_KEY);
}

/* ─── Lockout ─── */
function getLock(){
  try{ return JSON.parse(localStorage.getItem(LOCKOUT_KEY)) || { fails:0, until:0 }; }
  catch{ return { fails:0, until:0 }; }
}
function setLock(v){ localStorage.setItem(LOCKOUT_KEY, JSON.stringify(v)); }
function clearLock(){ localStorage.removeItem(LOCKOUT_KEY); }

function setLoading(on){
  document.getElementById('checkingDiv').classList.toggle('show', on);
  document.getElementById('loginForm').style.display = on ? 'none' : 'block';
}

async function checkAutoLogin(){
  const sess = await getSavedSession();
  if (!sess){ setLoading(false); return; }
  if (ACCOUNTS.some(a => a.username === sess.u)){
    window.location.replace('../');
  } else { clearSession(); setLoading(false); }
}

async function doLogin(){
  const u = document.getElementById('usr').value.trim();
  const p = document.getElementById('pwd').value;
  const rem = document.getElementById('rememberMe').checked;
  const errEl = document.getElementById('errMsg');
  const btn = document.getElementById('loginBtn');

  errEl.textContent = '';

  const lock = getLock();
  if (lock.until > Date.now()){
    const s = Math.ceil((lock.until - Date.now())/1000);
    errEl.textContent = `✕  Demasiados intentos. Espera ${s}s`;
    return;
  }
  if (!u || !p){ errEl.textContent = '✕  Completa todos los campos'; return; }

  btn.disabled = true; btn.textContent = 'Verificando…';

  const acc = ACCOUNTS.find(a => a.username === u);
  /* Siempre derivamos para que el tiempo de respuesta sea similar exista o no el usuario */
  const dummy = { salt:'dummy-salt', hash:'0'.repeat(64) };
  const target = acc || dummy;
  const [got, expected] = await Promise.all([
    deriveCompare(p, target.salt),
    expectedFromAccount(target)
  ]);
  const ok = !!acc && constEq(got, expected);

  if (!ok){
    const nl = { fails: lock.fails + 1, until: 0 };
    if (nl.fails >= MAX_ATTEMPTS){ nl.until = Date.now() + LOCKOUT_MS; nl.fails = 0; }
    setLock(nl);
    errEl.textContent = nl.until ? '✕  Bloqueado temporalmente por seguridad' : '✕  Usuario o contraseña incorrectos';
    document.getElementById('pwd').value = '';
    document.getElementById('pwd').focus();
    btn.disabled = false; btn.textContent = 'Entrar ›';
    return;
  }

  clearLock();
  await saveSession(acc.username, rem);
  window.location.replace('../');
}

document.getElementById('loginBtn').addEventListener('click', doLogin);
document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
window.addEventListener('load', () => { setLoading(true); checkAutoLogin(); });
</script>
</body>
</html>
