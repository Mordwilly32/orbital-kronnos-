<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orbital Kronnos — Acceso</title>
<link rel="icon" href="../images/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --cream:  #F5EBD6;
  --cream2: #d8cdb3;
  --gold:   #E2BF6E;
  --gold2:  #C9A14A;
  --gold3:  #B07D3B;
  --dark:   #0a0807;
  --dark2:  #161210;
  --glow:   rgba(226,191,110,0.22);
  --fd: "Orbitron","Cinzel",sans-serif;
  --fs: "Cinzel",serif;
  --fb: "Cormorant Garamond",Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  background:var(--dark);
  color:var(--cream);
  font-family:var(--fb);
  font-size:18px;
  line-height:1.65;
  min-height:100vh;
  overflow-x:hidden;
  display:flex;
  flex-direction:column;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}

/* BG */
.bg{position:fixed;inset:0;z-index:0;background:url('../images/fondo.png') center/cover no-repeat;filter:brightness(0.28) contrast(1.05);animation:bz 20s ease-in-out infinite alternate;}
@keyframes bz{from{transform:scale(1);}to{transform:scale(1.07);}}
.bgo{position:fixed;inset:0;z-index:1;background:radial-gradient(ellipse at 50% 0%,rgba(201,161,74,.1),transparent 60%),linear-gradient(180deg,rgba(10,8,7,.72),rgba(10,8,7,.45) 50%,rgba(10,8,7,.88));}

/* HEADER */
.hdr{position:relative;z-index:10;padding:20px 40px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--glow);background:rgba(10,8,7,.6);backdrop-filter:blur(12px);}
.hdr-logo{font-family:var(--fd);font-weight:900;font-size:17px;letter-spacing:4px;color:var(--gold);}
.hdr-logo em{font-style:normal;}
.hdr-back{font-family:var(--fd);font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--cream2);border:1px solid var(--glow);padding:8px 18px;transition:all .25s;}
.hdr-back:hover{color:var(--gold);border-color:var(--gold);}

/* MAIN */
main{position:relative;z-index:5;flex:1;display:flex;align-items:center;justify-content:center;padding:60px 24px;}

/* CARD */
.card{width:100%;max-width:460px;background:rgba(14,11,10,.92);border:1px solid var(--glow);backdrop-filter:blur(18px);padding:52px 46px 46px;position:relative;animation:cin .75s ease-out both;}
@keyframes cin{from{opacity:0;transform:translateY(28px);}to{opacity:1;transform:translateY(0);}}
.card::before{content:"";position:absolute;top:0;left:12%;right:12%;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);}
.card::after{content:"";position:absolute;bottom:0;left:12%;right:12%;height:1px;background:linear-gradient(90deg,transparent,var(--glow),transparent);}

.eyebrow{font-family:var(--fd);font-size:10px;letter-spacing:6px;color:var(--gold);text-transform:uppercase;text-align:center;margin-bottom:14px;display:flex;align-items:center;gap:10px;justify-content:center;}
.eyebrow::before,.eyebrow::after{content:"";flex:1;height:1px;background:var(--glow);max-width:44px;}
.card-title{font-family:var(--fd);font-weight:900;font-size:26px;letter-spacing:3px;text-align:center;margin-bottom:6px;background:linear-gradient(180deg,#f0d488,var(--gold) 50%,var(--gold3));-webkit-background-clip:text;background-clip:text;color:transparent;text-transform:uppercase;}
.card-sub{text-align:center;font-style:italic;color:var(--cream2);font-size:16px;margin-bottom:36px;}

.lbl{display:block;font-family:var(--fd);font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--gold);margin-bottom:8px;}
.inp{width:100%;padding:13px 16px;background:rgba(10,8,7,.8);border:1px solid var(--glow);color:var(--cream);font-family:var(--fb);font-size:17px;outline:none;transition:border-color .25s,box-shadow .25s;margin-bottom:20px;}
.inp::placeholder{color:rgba(216,205,179,.35);}
.inp:focus{border-color:var(--gold);background:rgba(20,17,15,.95);box-shadow:0 0 18px rgba(201,161,74,.13);}

/* REMEMBER ME */
.remember-row{display:flex;align-items:center;gap:10px;margin-bottom:22px;cursor:pointer;user-select:none;}
.remember-row input[type="checkbox"]{appearance:none;-webkit-appearance:none;width:18px;height:18px;border:1px solid var(--glow);background:rgba(10,8,7,.8);cursor:pointer;position:relative;flex-shrink:0;transition:border-color .25s,background .25s;}
.remember-row input[type="checkbox"]:checked{background:linear-gradient(180deg,var(--gold),var(--gold3));border-color:var(--gold);}
.remember-row input[type="checkbox"]:checked::after{content:"✓";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:var(--dark);font-size:12px;font-weight:900;font-family:var(--fd);}
.remember-row span{font-family:var(--fd);font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--cream2);}

/* CAPTCHA */
.captcha-wrap{display:flex;justify-content:center;margin-bottom:20px;}
/* Force reCAPTCHA to fit narrow cards */
.captcha-wrap .g-recaptcha{transform:scale(0.92);transform-origin:center top;}

.err{font-family:var(--fd);font-size:10px;letter-spacing:2px;color:#c0392b;text-align:center;min-height:16px;margin-bottom:16px;text-transform:uppercase;}

.btn{width:100%;padding:15px;background:linear-gradient(180deg,var(--gold),var(--gold3));color:var(--dark);font-family:var(--fd);font-weight:700;font-size:11px;letter-spacing:5px;text-transform:uppercase;border:none;cursor:pointer;transition:transform .25s,box-shadow .25s;box-shadow:0 8px 24px rgba(201,161,74,.2);}
.btn:hover{transform:translateY(-3px);box-shadow:0 14px 36px rgba(201,161,74,.45);}
.btn:active{transform:translateY(0);}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}

/* CHECKING OVERLAY */
.checking{display:none;flex-direction:column;align-items:center;gap:16px;padding:40px 0;}
.checking.show{display:flex;}
.spinner{width:36px;height:36px;border:2px solid var(--glow);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.checking p{font-family:var(--fd);font-size:10px;letter-spacing:4px;color:var(--cream2);text-transform:uppercase;}

/* FOOTER */
footer{position:relative;z-index:5;text-align:center;padding:20px;font-size:13px;color:var(--cream2);font-style:italic;border-top:1px solid var(--glow);background:rgba(10,8,7,.5);}

/* ── DASHBOARD ── */
#dash{display:none;position:relative;z-index:5;flex:1;padding:40px 28px 60px;animation:cin .6s ease-out both;}
#dash.show{display:block;}

.dash-wrap{max-width:1080px;margin:0 auto;}
.dash-top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:44px;}
.dash-name{font-family:var(--fd);font-weight:900;font-size:clamp(20px,3.5vw,34px);letter-spacing:3px;text-transform:uppercase;margin-bottom:10px;}
.dash-name span{background:linear-gradient(180deg,#f0d488,var(--gold) 50%,var(--gold3));-webkit-background-clip:text;background-clip:text;color:transparent;}
.dash-badge{display:inline-block;background:linear-gradient(180deg,var(--gold),var(--gold3));color:var(--dark);font-family:var(--fd);font-weight:700;font-size:10px;letter-spacing:3px;text-transform:uppercase;padding:5px 14px;}
.btn-out{font-family:var(--fd);font-size:10px;letter-spacing:4px;text-transform:uppercase;padding:10px 22px;border:1px solid var(--glow);background:transparent;color:var(--cream2);cursor:pointer;transition:all .25s;}
.btn-out:hover{border-color:var(--gold);color:var(--gold);}
.div-line{height:1px;background:linear-gradient(90deg,var(--glow),transparent);margin-bottom:32px;}

/* ADMIN LOG */
.s-eyebrow{font-family:var(--fd);font-size:10px;letter-spacing:6px;color:var(--gold);text-transform:uppercase;margin-bottom:10px;}
.s-title{font-family:var(--fd);font-weight:900;font-size:clamp(18px,2.5vw,28px);letter-spacing:3px;text-transform:uppercase;color:var(--cream);margin-bottom:6px;}
.s-sub{font-style:italic;color:var(--cream2);margin-bottom:28px;font-size:17px;}
.tbl-wrap{border:1px solid var(--glow);background:rgba(14,11,10,.85);overflow:hidden;overflow-x:auto;}
.tbl{width:100%;border-collapse:collapse;}
.tbl thead tr{border-bottom:1px solid var(--glow);}
.tbl th{font-family:var(--fd);font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--gold);padding:16px 20px;text-align:left;white-space:nowrap;}
.tbl td{padding:14px 20px;font-size:16px;color:var(--cream2);border-bottom:1px solid rgba(226,191,110,.07);}
.tbl tbody tr:last-child td{border-bottom:none;}
.tbl tbody tr:hover td{background:rgba(226,191,110,.04);}
.td-u{font-family:var(--fd);font-size:12px;letter-spacing:2px;color:var(--cream)!important;font-weight:700;}
.rbadge{display:inline-block;font-family:var(--fd);font-size:9px;letter-spacing:2px;text-transform:uppercase;padding:3px 10px;}
.r-adm{background:linear-gradient(180deg,var(--gold),var(--gold3));color:var(--dark);}
.r-mem{background:rgba(226,191,110,.1);color:var(--gold);border:1px solid var(--glow);}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;}
.dot-on{background:#27ae60;box-shadow:0 0 8px rgba(39,174,96,.7);}
.dot-off{background:rgba(216,205,179,.3);}

/* MEMBER CARD */
.ia-card{border:1px solid var(--glow);background:rgba(14,11,10,.85);padding:48px 40px;text-align:center;position:relative;max-width:560px;}
.ia-card::before{content:"";position:absolute;top:0;left:15%;right:15%;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);}
.ia-card p{color:var(--cream2);font-size:18px;font-style:italic;margin-bottom:28px;}
.btn-ia{display:inline-flex;align-items:center;gap:10px;font-family:var(--fd);font-size:12px;font-weight:700;letter-spacing:4px;text-transform:uppercase;padding:16px 38px;background:linear-gradient(180deg,var(--gold),var(--gold3));color:var(--dark);border:none;cursor:pointer;transition:all .3s;box-shadow:0 10px 30px rgba(201,161,74,.22);text-decoration:none;}
.btn-ia:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(201,161,74,.5);}

/* orbs */
.orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:2;}
.o1{width:380px;height:380px;background:radial-gradient(circle,rgba(201,161,74,.08),transparent 70%);top:-100px;right:-80px;animation:of 13s ease-in-out infinite alternate;}
.o2{width:280px;height:280px;background:radial-gradient(circle,rgba(201,161,74,.06),transparent 70%);bottom:5%;left:-70px;animation:of 17s 4s ease-in-out infinite alternate;}
@keyframes of{from{transform:translate(0,0);}to{transform:translate(28px,18px);}}

@media(max-width:520px){
  .card{padding:38px 20px 32px;}
  .hdr{padding:16px 20px;}
  .ia-card{padding:36px 20px;}
  .captcha-wrap .g-recaptcha{transform:scale(0.82);transform-origin:center top;}
}
</style>
</head>
<body>

<div class="bg"></div>
<div class="bgo"></div>
<div class="orb o1"></div>
<div class="orb o2"></div>

<header class="hdr">
  <span class="hdr-logo">ORBITAL <em>KRONNOS</em></span>
  <a href="../" class="hdr-back">← Volver al inicio</a>
</header>

<!-- ── LOGIN ── -->
<main id="loginSection">
  <div class="card">
    <!-- Checking session overlay -->
    <div class="checking" id="checkingDiv">
      <div class="spinner"></div>
      <p>Verificando sesión…</p>
    </div>

    <!-- Login form (hidden while checking) -->
    <div id="loginForm">
      <div class="eyebrow">— Acceso —</div>
      <h1 class="card-title">Iniciar Sesión</h1>
      <p class="card-sub">Ingresa tus credenciales del equipo</p>

      <label class="lbl" for="usr">Usuario</label>
      <input class="inp" type="text" id="usr" placeholder="tu_usuario" autocomplete="username" />

      <label class="lbl" for="pwd">Contraseña</label>
      <input class="inp" type="password" id="pwd" placeholder="••••••••" autocomplete="current-password" />

      <!-- Remember me -->
      <label class="remember-row">
        <input type="checkbox" id="rememberMe" />
        <span>Mantener sesión iniciada</span>
      </label>

      <div class="err" id="errMsg"></div>
      <button class="btn" id="loginBtn" onclick="doLogin()">Entrar ›</button>
    </div>
  </div>
</main>

<!-- ── DASHBOARD ── -->
<div id="dash">
  <div class="dash-wrap">

    <div class="dash-top">
      <div>
        <div class="dash-name">Bienvenido, <span id="dName"></span></div>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
          <span class="dash-badge" id="dRole"></span>
          <span style="font-size:15px;font-style:italic;color:var(--cream2);" id="dSub"></span>
        </div>
      </div>
      <button class="btn-out" onclick="doLogout()">← Cerrar sesión</button>
    </div>

    <div class="div-line"></div>

    <!-- MEMBER: RoboCoach button -->
    <div id="memberBlock" style="display:flex;justify-content:center;">
      <div class="ia-card">
        <p class="s-eyebrow" style="margin-bottom:12px;">— Tu acceso —</p>
        <p>Tienes acceso al asistente <strong style="color:var(--gold);">RoboCoach</strong>.<br>Haz clic para abrir la IA.</p>
        <a href="../roborobin/" class="btn-ia">🤖 Abrir RoboCoach ›</a>
      </div>
    </div>

  </div>
</div>

<footer>© 2026 Orbital Kronnos · STEAM Maker Challenge · El Salvador</footer>

<script>
/* ── ACCOUNTS ── */
const ACCOUNTS = [
  { username:'willyberd', password:'chiala2coty0', role:'member', display:'willyberd' },
  { username:'Chigiri',   password:'C4m4r0n',      role:'member', display:'Chigiri'   },
  { username:'Rhis',      password:'Elp4pu19',      role:'member', display:'Rhis'      }
];

/* ── STORAGE KEYS ── */
const SESSION_KEY = 'ok_session_v2';
const SESSION_TTL = 7 * 24 * 60 * 60 * 1000; // 7 days

let activeUser = null;

/* ── IP HELPER ── */
async function getCurrentIP() {
  try {
    const r = await fetch('https://api.ipify.org?format=json', { cache:'no-store' });
    const d = await r.json();
    return d.ip || null;
  } catch { return null; }
}

/* ── SAVED SESSION ── */
function getSavedSession() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (Date.now() - s.ts > SESSION_TTL) { localStorage.removeItem(SESSION_KEY); return null; }
    return s;
  } catch { return null; }
}

function saveSession(username, ip) {
  localStorage.setItem(SESSION_KEY, JSON.stringify({ username, ip, ts: Date.now() }));
}

function clearSession() {
  localStorage.removeItem(SESSION_KEY);
}

/* ── AUTO-LOGIN CHECK ── */
async function checkAutoLogin() {
  const sess = getSavedSession();
  if (!sess) { showLoginForm(); return; }

  showChecking(true);
  const ip = await getCurrentIP();

  if (ip && ip === sess.ip) {
    const acc = ACCOUNTS.find(a => a.username === sess.username);
    if (acc) {
      activeUser = acc;
      showDash(acc);
      return;
    }
  }

  /* IP changed or account not found — clear stale session */
  clearSession();
  showLoginForm();
}

function showChecking(on) {
  document.getElementById('checkingDiv').classList.toggle('show', on);
  document.getElementById('loginForm').style.display = on ? 'none' : 'block';
}
function showLoginForm() {
  showChecking(false);
}

/* ── LOGIN ── */
async function doLogin() {
  const u   = document.getElementById('usr').value.trim();
  const p   = document.getElementById('pwd').value;
  const rem = document.getElementById('rememberMe').checked;
  const errEl = document.getElementById('errMsg');

  /* Check if fields are empty */
  if (!u || !p) {
    errEl.textContent = '✕  Por favor completa todos los campos';
    return;
  }

  const acc = ACCOUNTS.find(a => a.username === u && a.password === p);
  if (!acc) {
    errEl.textContent = '✕  Usuario o contraseña incorrectos';
    document.getElementById('pwd').value = '';
    document.getElementById('pwd').focus();
    return;
  }

  errEl.textContent = '';
  activeUser = acc;

  /* Save session by IP if "remember me" checked */
  if (rem) {
    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    btn.textContent = 'Guardando sesión…';
    const ip = await getCurrentIP();
    if (ip) saveSession(acc.username, ip);
    btn.disabled = false;
    btn.textContent = 'Entrar ›';
  }

  showDash(acc);
}

/* ── DASHBOARD ── */
function showDash(acc) {
  document.getElementById('loginSection').style.display = 'none';
  const dash = document.getElementById('dash');
  dash.classList.add('show');
  dash.style.display = 'block';

  document.getElementById('dName').textContent = acc.display;
  document.getElementById('dRole').textContent = '◆ Miembro';
  document.getElementById('dSub').textContent  = 'Acceso a RoboCoach';
  document.getElementById('memberBlock').style.display = 'flex';
}

function doLogout() {
  activeUser = null;
  clearSession();
  document.getElementById('dash').classList.remove('show');
  document.getElementById('dash').style.display = 'none';
  document.getElementById('loginSection').style.display = 'flex';
  document.getElementById('usr').value  = '';
  document.getElementById('pwd').value  = '';
  showLoginForm();
}

/* ── KEYBOARD ── */
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('loginSection').style.display !== 'none') doLogin();
});

/* ── ON LOAD — check for saved session ── */
window.addEventListener('load', checkAutoLogin);
</script>
</body>
</html>
